name: Test an AtomGit pull request

run-name: "PR #${{ inputs.pr_number }} Test"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in cann/catlass on AtomGit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-atomgit-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Register and classify PR test
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.pr.outputs.base-ref }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head-ref }}
      head_sha: ${{ steps.pr.outputs.head-sha }}
      comment_id: ${{ steps.rdv_start.outputs.comment-id }}
      run_dsl: ${{ steps.changes.outputs.run_dsl }}
      run_all: ${{ steps.changes.outputs.run_all }}

    steps:
      - name: Read pull request metadata from AtomGit
        id: pr
        uses: yuantao313/actions/atomgit-pr-metadata@02defff4ec04b38b33adfaec06bcb1406f5a2150
        with:
          repository: cann/catlass
          pr-number: ${{ inputs.pr_number }}
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}

      - name: Mark the pull request as running
        id: rdv_start
        continue-on-error: true
        uses: ascend-catlass/actions/.github/actions/rdv-status@main
        with:
          phase: start
          pr-number: ${{ inputs.pr_number }}
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          result-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Classify pull request changes
        id: changes
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_REF: ${{ steps.pr.outputs.base-ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: |
          set -euo pipefail

          rdv_temp_root="${RUNNER_TEMP}/catlass-rdv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worktree="${rdv_temp_root}/worktree"

          git clone --quiet --no-tags --single-branch \
            --branch "${BASE_REF}" \
            https://atomgit.com/cann/catlass.git \
            "${worktree}"

          # Use the target branch actually fetched for this job. Normal target
          # updates are allowed; the merge stage checks whether the PR conflicts.
          BASE_SHA="$(git -C "${worktree}" rev-parse HEAD)"
          echo "base_sha=${BASE_SHA}" >>"${GITHUB_OUTPUT}"

          git -C "${worktree}" fetch --quiet --no-tags origin \
            "+refs/merge-requests/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

          fetched_head="$(
            git -C "${worktree}" rev-parse refs/remotes/origin/pr-head
          )"

          if [[ "${fetched_head}" != "${HEAD_SHA}" ]]; then
            echo "PR head changed while this workflow was starting; run it again" >&2
            exit 1
          fi

          diff_file="${rdv_temp_root}/changed-paths"
          git -C "${worktree}" diff --no-renames --name-only -z \
            "${BASE_SHA}...${HEAD_SHA}" > "${diff_file}"

          run_dsl=false
          run_all=false

          while IFS= read -r -d '' changed_path; do
            case "${changed_path}" in
              docs/* | \
              *.md | \
              *.rst | \
              *.png | \
              *.jpg | \
              *.jpeg | \
              *.gif | \
              *.svg | \
              *.webp | \
              *.bmp | \
              *.ico)
                change_type=non-code
                ;;

              # Include the DSL battery outside python/tla_dsl, without
              # treating every file under tests/ as a DSL change.
              python/tla_dsl/* | \
              tests/run_dsl_test.sh | \
              tests/dsl_battery/*)
                change_type=dsl
                run_dsl=true
                ;;

              *)
                change_type=non-dsl
                run_all=true
                ;;
            esac

            printf '%s: %s\n' \
              "${change_type}" \
              "${changed_path}"
          done < "${diff_file}"

          {
            echo "run_dsl=${run_dsl}"
            echo "run_all=${run_all}"
          } >>"${GITHUB_OUTPUT}"

      - name: Pass non-code-only changes
        if: >-
          ${{ steps.changes.outputs.run_dsl != 'true' &&
              steps.changes.outputs.run_all != 'true' }}
        run: |
          echo "Only documentation or image files changed; no tests are required."

  tools:
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' && (needs.prepare.outputs.run_dsl == 'true' || needs.prepare.outputs.run_all == 'true') }}
    uses: ./.github/workflows/package-hardware-tools.yml

  merge-and-test:
    name: "Test PR #${{ inputs.pr_number }}"
    needs: [prepare, tools]
    if: ${{ github.ref == 'refs/heads/main' && (needs.prepare.outputs.run_dsl == 'true' || needs.prepare.outputs.run_all == 'true') }}
    runs-on: [self-hosted, ascend950]
    timeout-minutes: 90
    env:
      RDV_CONTAINER: catlass-rdv-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Download tools prepared for this run
        uses: actions/download-artifact@v4
        with:
          name: catlass-hardware-tools
          path: hardware-tools
      - name: Detect runner environment
        shell: bash
        run: |
          if [[ -f /.dockerenv ]]; then
            echo "Runner is already inside a container; tests will use its environment."
          else
            echo "Runner is on the host; tests will use a disposable Ascend container."
          fi

      - name: Merge the pull request into its target branch
        id: merge
        uses: yuantao313/actions/atomgit-checkout-pr@02defff4ec04b38b33adfaec06bcb1406f5a2150
        with:
          repository: cann/catlass
          pr-number: ${{ inputs.pr_number }}
          base-ref: ${{ needs.prepare.outputs.base_ref }}
          head-sha: ${{ needs.prepare.outputs.head_sha }}
          worktree: ${{ github.workspace }}/.rdv-work/pr-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create test container
        id: create_container
        if: >-
          ${{ needs.prepare.outputs.run_dsl == 'true' ||
              needs.prepare.outputs.run_all == 'true' }}
        uses: ./hardware-tools/.github/actions/create-ascend-container
        with:
          image-repository: ascend-catlass-dsl
          image-tag: ubuntu24-py312-weekly-v1
          base-image: docker.m.daocloud.io/library/ubuntu:24.04
          cann-root: /opt/cann_weekly/latest/ascend-toolkit
          npuir-root: /opt/AscendNPU-IR/latest/AscendNPU-IR
          name: ${{ env.RDV_CONTAINER }}
          worktree: ${{ steps.merge.outputs.worktree }}

      - name: Prepare test dependencies and device
        id: prepare_tests
        if: >-
          ${{ needs.prepare.outputs.run_dsl == 'true' ||
              needs.prepare.outputs.run_all == 'true' }}
        uses: ./hardware-tools/.github/actions/prepare-ci-tests
        with:
          worktree: ${{ steps.create_container.outputs.worktree }}
          container: ${{ steps.create_container.outputs.container-name }}
          helpers-path: ${{ github.workspace }}/hardware-tools/shared_actions

      - name: Build DSL in dev mode
        id: dsl_dev
        if: ${{ needs.prepare.outputs.run_dsl == 'true' }}
        uses: ./hardware-tools/.github/actions/run-ci-tests
        with:
          suite: dsl-dev
          worktree: ${{ steps.create_container.outputs.worktree }}
          container: ${{ steps.create_container.outputs.container-name }}
          device-id: ${{ steps.prepare_tests.outputs.device-id }}

      - name: Run DSL IR tests
        id: dsl_ir
        if: ${{ !cancelled() && steps.dsl_dev.outcome == 'success' }}
        uses: ./hardware-tools/.github/actions/run-ci-tests
        with:
          suite: dsl-ir
          worktree: ${{ steps.create_container.outputs.worktree }}
          container: ${{ steps.create_container.outputs.container-name }}
          device-id: ${{ steps.prepare_tests.outputs.device-id }}

      - name: Run DSL Lit tests
        id: dsl_lit
        if: ${{ !cancelled() && steps.dsl_dev.outcome == 'success' }}
        uses: ./hardware-tools/.github/actions/run-ci-tests
        with:
          suite: dsl-lit
          worktree: ${{ steps.create_container.outputs.worktree }}
          container: ${{ steps.create_container.outputs.container-name }}
          device-id: ${{ steps.prepare_tests.outputs.device-id }}

      - name: Build Release wheel and run DSL device tests
        if: ${{ !cancelled() && steps.dsl_dev.outcome == 'success' }}
        uses: ./hardware-tools/.github/actions/run-ci-tests
        with:
          suite: dsl
          worktree: ${{ steps.create_container.outputs.worktree }}
          container: ${{ steps.create_container.outputs.container-name }}
          device-id: ${{ steps.prepare_tests.outputs.device-id }}

      - name: Run non-DSL test stage
        if: >-
          ${{ !cancelled() &&
              steps.merge.outcome == 'success' &&
              steps.create_container.outcome == 'success' &&
              steps.prepare_tests.outcome == 'success' &&
              needs.prepare.outputs.run_all == 'true' }}
        uses: ./hardware-tools/.github/actions/run-ci-tests
        with:
          suite: all
          base-sha: ${{ steps.merge.outputs.base-sha }}
          head-sha: ${{ needs.prepare.outputs.head_sha }}
          worktree: ${{ steps.create_container.outputs.worktree }}
          container: ${{ steps.create_container.outputs.container-name }}
          device-id: ${{ steps.prepare_tests.outputs.device-id }}

      - name: Delete test container and source directory
        if: ${{ always() }}
        shell: bash
        env:
          CONTAINER_NAME: ${{ steps.create_container.outputs.container-name }}
          SOURCE_DIR: ${{ github.workspace }}/.rdv-work/pr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          workspace=$(realpath -e "${GITHUB_WORKSPACE}")
          expected="${workspace}/.rdv-work/pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ && "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ ! -L "${SOURCE_DIR}" && "$(realpath -m "${SOURCE_DIR}")" == "${expected}" ]] || {
            echo '::error::Refusing to clean an unexpected source directory'
            exit 1
          }
          if [[ -n "${CONTAINER_NAME}" ]]; then
            [[ "${CONTAINER_NAME}" == "catlass-rdv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          fi
          if [[ -n "${CONTAINER_NAME}" ]] && docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
            docker rm --force "${CONTAINER_NAME}"
          fi
          if [[ -d "${SOURCE_DIR}" ]]; then
            if [[ "$(id -u)" == 0 ]]; then
              rm -rf --one-file-system -- "${SOURCE_DIR}"
            else
              sudo -n rm -rf --one-file-system -- "${SOURCE_DIR}"
            fi
          fi

  analyze-failure:
    name: Analyze failed TestPR logs with DeepSeek
    if: ${{ github.ref == 'refs/heads/main' && always() && needs.prepare.outputs.head_sha != '' && (needs.prepare.result == 'failure' || needs.merge-and-test.result == 'failure') }}
    needs: [prepare, merge-and-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Analyze failed workflow jobs
        id: diagnosis
        continue-on-error: true
        uses: ascend-catlass/actions/.github/actions/analyze-ci-failure@main
        with:
          github-token: ${{ github.token }}
          trae-pat: ${{ secrets.TRAE_CN_PAT }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
      - name: Save comment attachment
        if: ${{ always() && steps.diagnosis.outputs.analysis-file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rdv-failure-analysis-${{ github.run_attempt }}
          path: ${{ steps.diagnosis.outputs.analysis-file }}
          retention-days: 7

  report:
    name: Report PR result
    if: ${{ github.ref == 'refs/heads/main' && (always() && needs.prepare.outputs.head_sha != '') }}
    needs:
      - prepare
      - merge-and-test
      - analyze-failure
    runs-on: ubuntu-latest

    steps:
      - name: Download failure diagnosis
        if: ${{ needs.prepare.result == 'failure' || needs.merge-and-test.result == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rdv-failure-analysis-${{ github.run_attempt }}
          path: _rdv-failure/
      - name: Keep failure reporting available when analysis fails
        if: ${{ always() && (needs.prepare.result == 'failure' || needs.merge-and-test.result == 'failure') }}
        shell: bash
        run: |
          mkdir -p _rdv-failure
          if [[ ! -s _rdv-failure/analysis.md ]]; then
            printf '%s\n' '失败原因自动分析暂不可用，请查看上方流水线日志。' > _rdv-failure/analysis.md
          fi
      - name: Report the result to AtomGit
        if: ${{ always() }}
        uses: ascend-catlass/actions/.github/actions/rdv-status@main
        with:
          phase: finish
          pr-number: ${{ inputs.pr_number }}
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          result: ${{ needs.prepare.result != 'success' && 'failure' || needs.prepare.outputs.run_dsl != 'true' && needs.prepare.outputs.run_all != 'true' && 'success' || needs.merge-and-test.result }}
          result-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          comment-id: ${{ needs.prepare.outputs.comment_id }}
          failure-analysis-file: ${{ (needs.prepare.result == 'failure' || needs.merge-and-test.result == 'failure') && '_rdv-failure/analysis.md' || '' }}
