name: Migrate NPUIR cache

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to migrate from the previous runner-local cache
        type: choice
        required: true
        default: "20261013"
        options:
          - "20261013"
          - "20260720"

run-name: Migrate NPUIR ${{ inputs.version }} · x86_64 + aarch64

permissions:
  contents: read

concurrency:
  group: local-npuir-${{ inputs.version == '20260720' && 'a07821269ede7a5e683ac02c8a2d291608083741' || '693abf31f3d88d13d30d9578fcf6513b90c0ee33' }}-clang19-v1
  cancel-in-progress: false

env:
  NPUIR_ARCHIVE_ROOT: /opt/AscendNPU-IR
  NPUIR_BUILD_FINGERPRINT: clang-19.1.7+lld-19.1.7
  NPUIR_BUILD_CONTRACT: clang19-lld19-release-rtti-assert-triton-zstd-off-v1
  NPUIR_BASELINE_DATE: ${{ inputs.version }}
  NPUIR_SOURCE_SHA: ${{ inputs.version == '20260720' && 'a07821269ede7a5e683ac02c8a2d291608083741' || '693abf31f3d88d13d30d9578fcf6513b90c0ee33' }}
  NPUIR_LEGACY_POSTFIX: ${{ inputs.version == '20260720' && '20260720' || '20260930' }}

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Migrate NPUIR (${{ matrix.target_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: x86_64
            runner_arch: X64
          - target_arch: aarch64
            runner_arch: ARM64
    runs-on: [self-hosted, publish, "${{ matrix.runner_arch }}"]
    timeout-minutes: 180
    steps:
      - name: Check out migration definitions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate runner architecture
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "${TARGET_ARCH}" ]] || {
            echo "::error::Runner architecture does not match ${TARGET_ARCH}"
            exit 1
          }

      - name: Migrate completed worker-local cache
        id: archive
        uses: ./.github/actions/npuir-local-archive
        with:
          operation: lookup
          archive_root: ${{ env.NPUIR_ARCHIVE_ROOT }}
          source_sha: ${{ env.NPUIR_SOURCE_SHA }}
          target_arch: ${{ matrix.target_arch }}
          build_contract: ${{ env.NPUIR_BUILD_CONTRACT }}
          baseline_date: ${{ env.NPUIR_BASELINE_DATE }}
          build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}
          legacy_postfix: ${{ env.NPUIR_LEGACY_POSTFIX }}
          legacy_build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}

      - name: Require completed archive and report migration
        shell: bash
        env:
          CACHE_HIT: ${{ steps.archive.outputs.cache_hit }}
          MIGRATED: ${{ steps.archive.outputs.legacy_cache_hit }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" != true ]]; then
            echo "::error::No completed cache for ${NPUIR_SOURCE_SHA} found on this worker; migration does not compile NPUIR"
            exit 1
          fi
          {
            echo "## NPUIR cache migration"
            echo "- Version: ${NPUIR_BASELINE_DATE}"
            echo "- Architecture: ${TARGET_ARCH}"
            echo "- Commit: ${NPUIR_SOURCE_SHA}"
            echo "- Path: ${ARCHIVE_PATH}"
            echo "- Copied old cache: ${MIGRATED}"
            echo "- Latest: $(readlink "${NPUIR_ARCHIVE_ROOT}/latest")"
          } >> "${GITHUB_STEP_SUMMARY}"
