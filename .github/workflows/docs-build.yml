name: Build automation documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check_docs.py'
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out shared Action helpers
        uses: actions/checkout@v4
        with:
          repository: yuantao313/actions
          ref: 4042e6e501fab8a2cee4e87fca0248b2347e05df
          path: shared_actions
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Run automation regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check CATLASS selective test behavior
        run: bash tests/test_targeted_ci.sh
      - name: Check TestPR failure analysis Actions
        run: node --test tests/rdv-failure-analysis.test.cjs
      - name: Check Action documentation and build the site
        run: |
          python scripts/check_docs.py
          python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: automation-docs-site
          path: site/
          if-no-files-found: error
          retention-days: 7
