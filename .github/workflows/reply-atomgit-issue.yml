name: "Community 1 · Issue analysis and label (TRAE CN)"
run-name: TRAE CN reply to ${{ inputs.issue_url }}

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: AtomGit Issue URL
        type: string
        required: true
        default: https://atomgit.com/cann/catlass/issues/739
      publish:
        description: Publish the label and eligible short analysis reply
        type: boolean
        default: true

env:
  TRAE_CN_HOST: ${{ vars.TRAE_CN_HOST }}

permissions:
  contents: read

concurrency:
  group: trae-cn-issue-${{ inputs.issue_url }}
  cancel-in-progress: false

jobs:
  reply:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out shared Action helpers
        uses: actions/checkout@v4
        with:
          repository: yuantao313/actions
          ref: 02defff4ec04b38b33adfaec06bcb1406f5a2150
          path: shared_actions
          persist-credentials: false
      - name: Install project policy dependencies
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Resolve Issue repository
        id: issue_repository
        env:
          ISSUE_URL: ${{ inputs.issue_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from scripts.atomgit_issue_reply import parse_url
          owner, repo, number = parse_url(os.environ['ISSUE_URL'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'repository={owner}/{repo}\n')
              handle.write(f'path=/repos/{owner}/{repo}/issues/{number}\n')
              if (owner, repo) != ('cann', 'catlass'):
                  raise ValueError('Expected cann/catlass Issue')
              handle.write(f'number={number}\n')
          PY
      - name: Prepare existing Issue type labels for every author
        id: label
        uses: ./.github/actions/atomgit-issue-label
        with:
          operation: prepare
          issue-number: ${{ steps.issue_repository.outputs.number }}
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
      - name: Read Issue author
        id: issue_author
        uses: yuantao313/actions/atomgit-api@02defff4ec04b38b33adfaec06bcb1406f5a2150
        with:
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          path: ${{ steps.issue_repository.outputs.path }}
      - name: Checkout community role declarations
        shell: bash
        run: git clone --depth 1 https://atomgit.com/cann/community.git _issue-community
      - name: Query repository committers and maintainers
        id: roles
        uses: ./.github/actions/community-repo-roles
        with:
          repository: ${{ steps.issue_repository.outputs.repository }}
          community-path: _issue-community
      - name: Check whether the Issue author needs an automated reply
        id: eligibility
        if: ${{ !contains(fromJSON('["confidential_issue", "issue_not_open"]'), steps.label.outputs.result) }}
        continue-on-error: true
        shell: bash
        env:
          ISSUE_FILE: ${{ steps.issue_author.outputs.response-file }}
          ROLES_FILE: ${{ steps.roles.outputs.result-file }}
          REPOSITORY: ${{ steps.issue_repository.outputs.repository }}
        run: |
          python3 -m scripts.issue_reply_eligibility \
            --issue-file "$ISSUE_FILE" --roles-file "$ROLES_FILE" --repository "$REPOSITORY"
      - name: Checkout Issue repository and prepare prompt
        if: ${{ steps.eligibility.outputs.analyze == 'true' }}
        uses: ./.github/actions/atomgit-issue
        with:
          operation: prepare
          roles-file: ${{ steps.roles.outputs.result-file }}
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          issue-url: ${{ inputs.issue_url }}
      - name: Compose one analysis and classification request
        id: request
        env:
          ANALYZE_REPLY: ${{ steps.eligibility.outputs.analyze }}
          ANALYZE_LABEL: ${{ steps.label.outputs.analyze }}
        run: python3 -m scripts.issue_analysis prepare
      - name: Analyze Issue and choose its label once
        id: trae
        if: ${{ steps.request.outputs.analyze == 'true' }}
        uses: ./.github/actions/catlass-ai
        with:
          pat: ${{ secrets.TRAE_CN_PAT }}
          working-directory: ${{ steps.request.outputs.worktree }}
          prompt-file: ${{ steps.request.outputs.prompt }}
          output-schema-file: ${{ steps.request.outputs.schema }}
      - name: Extract publisher results with original execution provenance
        id: extract
        if: ${{ steps.trae.outputs.status == 'success' }}
        env:
          STAGE_RESULT: ${{ steps.trae.outputs.result-directory }}
        run: python3 -m scripts.issue_analysis extract
      - name: Recheck, apply the selected label and read it back
        if: ${{ steps.extract.outcome == 'success' && steps.label.outputs.analyze == 'true' && inputs.publish }}
        uses: ./.github/actions/atomgit-issue-label
        with:
          operation: publish
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          stage-result: _issue-analysis/label
      - name: Publish and read back the short reply
        if: ${{ !cancelled() && steps.extract.outcome == 'success' && steps.eligibility.outputs.analyze == 'true' && inputs.publish }}
        uses: ./.github/actions/atomgit-issue
        with:
          operation: publish
          roles-file: ${{ steps.roles.outputs.result-file }}
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          stage-result: _issue-analysis/reply
      - name: Save analysis and publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: atomgit-issue-reply-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _issue-result/
            _issue-label-result/
            _issue-analysis/
            ${{ steps.trae.outputs.result-directory }}
          if-no-files-found: ignore
          retention-days: 7
