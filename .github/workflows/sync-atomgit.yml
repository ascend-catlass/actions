name: Sync AtomGit master and tags

on:
  schedule:
    # 02:00 Asia/Shanghai (18:00 UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-atomgit-master-and-tags
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the GitHub mirror
        uses: actions/checkout@v5
        with:
          repository: ascend-catlass/catlass
          ref: master
          fetch-depth: 1
          fetch-tags: false
          ssh-key: ${{ secrets.CATLASS_DEPLOY_KEY }}
          path: catlass-mirror

      - name: Fetch AtomGit master and tags
        shell: bash
        working-directory: catlass-mirror
        run: |
          set -euo pipefail

          git remote add atomgit https://atomgit.com/cann/catlass.git
          git fetch --force --prune --prune-tags atomgit \
            +refs/heads/master:refs/remotes/atomgit/master \
            +refs/tags/*:refs/tags/*

      - name: Update GitHub master and tags
        shell: bash
        working-directory: catlass-mirror
        run: |
          set -euo pipefail

          git push --force origin \
            refs/remotes/atomgit/master:refs/heads/master
          git push --force --prune origin \
            'refs/tags/*:refs/tags/*'
