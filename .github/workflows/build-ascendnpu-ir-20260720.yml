name: Build AscendNPU-IR 20260720 a07821269ede

on:
  workflow_call:
    inputs:
      branch:
        description: AscendNPU-IR branch used when the archive is missing
        required: false
        default: feature/regbase
        type: string
      ref:
        description: Exact AscendNPU-IR commit required by CATLASS
        required: true
        type: string
      use_mirror:
        description: Use Huawei Cloud mirrors while building
        required: false
        default: true
        type: boolean
      build_jobs:
        description: Maximum parallel compile jobs on x86_64; ARM64 always uses all available CPUs
        required: false
        default: 64
        type: number
  workflow_dispatch:
    inputs:
      branch:
        description: AscendNPU-IR branch used when the archive is missing
        required: true
        default: feature/regbase
        type: string
      ref:
        description: AscendNPU-IR commit used when the archive is missing
        required: true
        default: a07821269ede7a5e683ac02c8a2d291608083741
        type: string
      use_mirror:
        description: Use Huawei Cloud mirrors while building
        required: false
        default: true
        type: boolean
      build_jobs:
        description: Maximum parallel compile jobs on x86_64; ARM64 always uses all available CPUs
        required: true
        default: 64
        type: number
run-name: NPUIR 20260720 · ${{ inputs.ref || 'a07821269ede7a5e683ac02c8a2d291608083741' }} · x86_64 + aarch64

permissions:
  contents: read

env:
  NPUIR_BUILD_FINGERPRINT: clang-19.1.7+lld-19.1.7
  NPUIR_BUILD_CONTRACT: clang19-lld19-release-rtti-assert-triton-zstd-off-v1
  NPUIR_BASELINE_DATE: "20260720"
  NPUIR_LEGACY_POSTFIX: "20260720"

concurrency:
  group: local-npuir-${{ inputs.ref || 'a07821269ede7a5e683ac02c8a2d291608083741' }}-clang19-v1
  cancel-in-progress: false

jobs:
  prepare:
    name: Reuse or build AscendNPU-IR (${{ matrix.target_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: x86_64
            runner_arch: X64
            container_image: quay.io/pypa/manylinux_2_28_x86_64
            use_all_cores: false
          - target_arch: aarch64
            runner_arch: ARM64
            container_image: quay.io/pypa/manylinux_2_28_aarch64
            use_all_cores: true
    runs-on: [self-hosted, publish, "${{ matrix.runner_arch }}"]
    timeout-minutes: 720
    env:
      NPUIR_TARGET_ARCH: ${{ matrix.target_arch }}

    steps:
      - name: Check out workflow definitions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch=$(uname -m)
          if [[ "${actual_arch}" != "${NPUIR_TARGET_ARCH}" ]]; then
            echo "::error::Runner architecture is ${actual_arch}, expected ${NPUIR_TARGET_ARCH}"
            exit 1
          fi

      - name: Look up worker-local NPUIR archive
        id: archive
        uses: ./.github/actions/npuir-local-archive
        with:
          operation: lookup
          source_sha: ${{ inputs.ref || 'a07821269ede7a5e683ac02c8a2d291608083741' }}
          target_arch: ${{ env.NPUIR_TARGET_ARCH }}
          build_contract: ${{ env.NPUIR_BUILD_CONTRACT }}
          baseline_date: ${{ env.NPUIR_BASELINE_DATE }}
          build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}
          legacy_postfix: ${{ env.NPUIR_LEGACY_POSTFIX }}
          legacy_build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}

      # This workflow owns all NPUIR build details. Other NPUIR pipelines can
      # use different checkout, patch, image, toolchain, and build commands,
      # while reusing only the local archive protocol above and below.
      - name: Check out AscendNPU-IR
        id: source
        if: ${{ steps.archive.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          NPUIR_BRANCH: ${{ inputs.branch || 'feature/regbase' }}
          NPUIR_REF: ${{ inputs.ref || 'a07821269ede7a5e683ac02c8a2d291608083741' }}
          WORK_PATH: ${{ steps.archive.outputs.work_path }}
        run: |
          set -euo pipefail

          if [[ -e "${WORK_PATH}" ]]; then
            echo "::error::Per-run NPUIR work directory already exists: ${WORK_PATH}"
            exit 1
          fi
          mkdir -p "${WORK_PATH%/*}"

          git clone --quiet --depth 1 --branch "${NPUIR_BRANCH}" \
            https://gitcode.com/Ascend/AscendNPU-IR.git "${WORK_PATH}"

          if git -C "${WORK_PATH}" rev-parse --verify --quiet "${NPUIR_REF}^{commit}" >/dev/null; then
            git -C "${WORK_PATH}" checkout --detach "${NPUIR_REF}"
          else
            git -C "${WORK_PATH}" fetch --quiet --depth 1 origin "${NPUIR_REF}"
            git -C "${WORK_PATH}" checkout --detach FETCH_HEAD
          fi
          git -C "${WORK_PATH}" submodule update --init --recursive --depth 1

          source_sha=$(git -C "${WORK_PATH}" rev-parse HEAD)
          if [[ "${source_sha}" != "${NPUIR_REF}" ]]; then
            echo "::error::Requested NPUIR commit ${NPUIR_REF}, checked out ${source_sha}"
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "Building NPUIR ${NPUIR_BRANCH} @ ${source_sha}"

      - name: Patch LLVM headers
        if: ${{ steps.archive.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          WORK_PATH: ${{ steps.archive.outputs.work_path }}
        run: |
          set -euo pipefail

          affine_header="${WORK_PATH}/third-party/llvm-project/mlir/include/mlir/Dialect/Affine/IR/ValueBoundsOpInterfaceImpl.h"
          interface_header="${WORK_PATH}/third-party/llvm-project/mlir/include/mlir/Interfaces/ValueBoundsOpInterface.h"
          spirv_deserialization_header="${WORK_PATH}/third-party/llvm-project/mlir/include/mlir/Target/SPIRV/Deserialization.h"

          grep -q '^#include <cstdint>$' "${affine_header}" || \
            sed -i 's|#include "mlir/Support/LLVM.h"|#include "mlir/Support/LLVM.h"\n#include <cstdint>|' "${affine_header}"
          grep -q '^#include <cstdint>$' "${interface_header}" || \
            sed -i 's|#include <queue>|#include <queue>\n#include <cstdint>|' "${interface_header}"
          grep -q '^#include <cstdint>$' "${spirv_deserialization_header}" || \
            sed -i 's|#include "mlir/Support/LLVM.h"|#include "mlir/Support/LLVM.h"\n#include <cstdint>|' \
              "${spirv_deserialization_header}"

          grep -n '^#include <cstdint>$' \
            "${affine_header}" \
            "${interface_header}" \
            "${spirv_deserialization_header}"

      - name: Create build container
        if: ${{ steps.archive.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          CONTAINER_NAME: npuir-${{ matrix.target_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          WORK_PATH: ${{ steps.archive.outputs.work_path }}
          NPUIR_IMAGE: ${{ matrix.container_image }}
        run: |
          set -euo pipefail
          docker run -d --name "${CONTAINER_NAME}" \
            -v "${WORK_PATH}:/workspace/AscendNPU-IR" \
            -w /workspace/AscendNPU-IR \
            "${NPUIR_IMAGE}" sleep infinity
          docker ps --filter "name=^/${CONTAINER_NAME}$" --format '{{.Names}} {{.Image}}'

      - name: Configure package mirrors
        if: ${{ steps.archive.outputs.cache_hit != 'true' && (inputs.use_mirror || github.event_name == 'schedule') }}
        shell: bash
        env:
          CONTAINER_NAME: npuir-${{ matrix.target_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker exec -u root "${CONTAINER_NAME}" bash -c '
            set -e
            printf "[global]\nindex-url = https://repo.huaweicloud.com/repository/pypi/simple\ntrusted-host = repo.huaweicloud.com\n" > /etc/pip.conf
            sed -i \
              -e "s|^mirrorlist=|#mirrorlist=|g" \
              -e "s|^# *baseurl=https://repo.almalinux.org/almalinux|baseurl=https://repo.huaweicloud.com/almalinux|g" \
              /etc/yum.repos.d/*.repo
            dnf clean all
          '

      - name: Install build dependencies
        if: ${{ steps.archive.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          CONTAINER_NAME: npuir-${{ matrix.target_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker exec -u root "${CONTAINER_NAME}" bash -c '
            set -e
            PYBIN=/opt/python/cp312-cp312/bin
            if [ ! -x "${PYBIN}/python" ]; then
              PYBIN=$(find /opt/python -maxdepth 1 -type d -name "cp3*" | sort -V | tail -1)/bin
            fi
            "${PYBIN}/python" -m pip install -U "cmake>=3.28" "ninja>=1.12"
            ln -sf "${PYBIN}/cmake" /usr/local/bin/cmake
            ln -sf "${PYBIN}/ninja" /usr/local/bin/ninja
            dnf install -y --nobest \
              "clang-19.1.7-2.module_el8.10.0+3990+33d0d926" \
              "lld-19.1.7-2.module_el8.10.0+3990+33d0d926"
            cmake --version | head -1
            ninja --version
            clang_version=$(/usr/bin/clang --version | sed -n "s/^clang version \([^ ]*\).*/\1/p" | head -1)
            lld_version=$(/usr/bin/ld.lld --version | sed -n "s/^LLD \([^ ]*\).*/\1/p" | head -1)
            case "${clang_version}:${lld_version}" in
              19.*:19.*) ;;
              *) echo "Expected clang/lld 19.x, got clang=${clang_version:-missing} lld=${lld_version:-missing}" >&2; exit 1 ;;
            esac
            /usr/bin/clang --version | head -1
            /usr/bin/clang++ --version | head -1
            /usr/bin/ld.lld --version | head -1
          '

      - name: Build AscendNPU-IR
        if: ${{ steps.archive.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          X86_BUILD_JOBS: ${{ inputs.build_jobs || 64 }}
          USE_ALL_CORES: ${{ matrix.use_all_cores }}
          CONTAINER_NAME: npuir-${{ matrix.target_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "${USE_ALL_CORES}" == true ]]; then
            BUILD_JOBS=$(nproc)
          else
            BUILD_JOBS=${X86_BUILD_JOBS}
          fi
          if [[ ! "${BUILD_JOBS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Resolved build job count must be a positive integer"
            exit 1
          fi
          echo "NPUIR ${NPUIR_TARGET_ARCH} parallel build jobs: ${BUILD_JOBS}"
          docker exec -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e BUILD_JOBS="${BUILD_JOBS}" \
            "${CONTAINER_NAME}" bash -c '
              set -e
              cd /workspace/AscendNPU-IR
              ./build-tools/build.sh \
                --c-compiler /usr/bin/clang \
                --cxx-compiler /usr/bin/clang++ \
                "--add-cmake-options=-DCMAKE_SYSROOT=/" \
                "--add-cmake-options=-DLLVM_ENABLE_ZSTD=OFF" \
                "--add-cmake-options=-DLLVM_ENABLE_RTTI=ON" \
                --build-type Release \
                -j "${BUILD_JOBS}" \
                --enable-assertion \
                --disable-werror \
                --disable-mlir-werror \
                --disable-bishengir-werror \
                --build-triton \
                --enable-lld \
                --build ./build \
                --apply-patches
            '

      - name: Publish worker-local NPUIR archive
        id: publish
        if: ${{ steps.archive.outputs.cache_hit != 'true' }}
        uses: ./.github/actions/npuir-local-archive
        with:
          operation: publish
          source_sha: ${{ steps.source.outputs.source_sha }}
          target_arch: ${{ env.NPUIR_TARGET_ARCH }}
          build_contract: ${{ env.NPUIR_BUILD_CONTRACT }}
          baseline_date: ${{ env.NPUIR_BASELINE_DATE }}
          source_path: ${{ steps.archive.outputs.work_path }}
          source_branch: ${{ inputs.branch || 'feature/regbase' }}
          source_ref: ${{ inputs.ref || 'a07821269ede7a5e683ac02c8a2d291608083741' }}
          build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}

      - name: Resolve selected NPUIR
        id: selected
        shell: bash
        env:
          CACHE_HIT: ${{ steps.archive.outputs.cache_hit }}
          CACHED_SHA: ${{ steps.archive.outputs.source_sha }}
          BUILT_SHA: ${{ steps.publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" == true ]]; then
            source_sha=${CACHED_SHA}
          else
            source_sha=${BUILT_SHA}
          fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Write NPUIR summary
        shell: bash
        env:
          CACHE_HIT: ${{ steps.archive.outputs.cache_hit }}
          LEGACY_CACHE_HIT: ${{ steps.archive.outputs.legacy_cache_hit }}
          NPUIR_PATH: ${{ steps.archive.outputs.path }}
          NPUIR_ARCHIVE_KEY: ${{ steps.archive.outputs.archive_key }}
          NPUIR_SHA: ${{ steps.selected.outputs.source_sha }}
          BUILD_CONTRACT: ${{ steps.archive.outputs.build_contract || steps.publish.outputs.build_contract }}
          BASELINE_DATE: ${{ steps.archive.outputs.baseline_date || steps.publish.outputs.baseline_date }}
        run: |
          set -euo pipefail
          {
            echo "## AscendNPU-IR local archive"
            echo
            echo "- Archive key: ${NPUIR_ARCHIVE_KEY}"
            echo "- Commit: ${NPUIR_SHA}"
            echo "- Target architecture: ${NPUIR_TARGET_ARCH}"
            echo "- Build contract: ${BUILD_CONTRACT}"
            echo "- Baseline date: ${BASELINE_DATE}"
            echo "- Build fingerprint: ${NPUIR_BUILD_FINGERPRINT}"
            echo "- Path: ${NPUIR_PATH}"
            echo "- Reused existing archive: ${CACHE_HIT}"
            echo "- Used transitional dated archive: ${LEGACY_CACHE_HIT}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean up transient NPUIR resources
        if: ${{ always() }}
        shell: bash
        env:
          CONTAINER_NAME: npuir-${{ matrix.target_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          WORK_PATH: ${{ steps.archive.outputs.work_path }}
        run: |
          set -euo pipefail
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          if [[ -n "${WORK_PATH}" && -e "${WORK_PATH}" ]]; then
            echo "::warning::Partial NPUIR build retained for inspection: ${WORK_PATH}"
          fi
