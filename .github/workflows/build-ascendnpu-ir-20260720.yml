name: Prepare AscendNPU-IR local archive

on:
  workflow_dispatch:
    inputs:
      NPUIR_PIPELINE_POSTFIX:
        description: Archive suffix, normally YYYYMMDD; empty means today in Asia/Shanghai
        required: false
        default: ""
        type: string
      branch:
        description: AscendNPU-IR branch used when the archive is missing
        required: true
        default: feature/regbase
        type: string
      ref:
        description: AscendNPU-IR commit used when the archive is missing
        required: true
        default: a07821269ede7a5e683ac02c8a2d291608083741
        type: string
      use_mirror:
        description: Use Huawei Cloud mirrors while building
        required: false
        default: true
        type: boolean

run-name: Prepare AscendNPU-IR (${{ inputs.NPUIR_PIPELINE_POSTFIX || 'today' }})

permissions:
  contents: read

concurrency:
  group: local-npuir-${{ inputs.NPUIR_PIPELINE_POSTFIX || 'daily' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Reuse or build AscendNPU-IR
    runs-on: [self-hosted, publish]
    timeout-minutes: 720

    steps:
      - name: Check out pipeline actions
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare worker-local NPUIR
        id: npuir
        uses: ./.github/actions/prepare-npuir
        with:
          NPUIR_PIPELINE_POSTFIX: ${{ inputs.NPUIR_PIPELINE_POSTFIX }}
          branch: ${{ inputs.branch }}
          ref: ${{ inputs.ref }}
          use_mirror: ${{ inputs.use_mirror }}

      - name: Write summary
        shell: bash
        env:
          CACHE_HIT: ${{ steps.npuir.outputs.cache_hit }}
          NPUIR_PATH: ${{ steps.npuir.outputs.path }}
          NPUIR_POSTFIX: ${{ steps.npuir.outputs.postfix }}
          NPUIR_SHA: ${{ steps.npuir.outputs.source_sha }}
        run: |
          set -euo pipefail
          {
            echo "## AscendNPU-IR local archive"
            echo
            echo "- Postfix: ${NPUIR_POSTFIX}"
            echo "- Commit: ${NPUIR_SHA}"
            echo "- Path: ${NPUIR_PATH}"
            echo "- Reused existing archive: ${CACHE_HIT}"
          } >> "${GITHUB_STEP_SUMMARY}"
