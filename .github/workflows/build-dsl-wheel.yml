name: Build and Release ascend-catlass-dsl wheel

on:
  workflow_call:
    inputs:
      NPUIR_PIPELINE_POSTFIX:
        description: Existing worker-local NPUIR archive suffix
        required: true
        type: string
      catlass_ref:
        description: GitCode CATLASS branch or tag to build
        required: false
        default: master
        type: string
    secrets:
      GITCODE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      NPUIR_PIPELINE_POSTFIX:
        description: Local NPUIR archive suffix, normally YYYYMMDD; empty means today in Asia/Shanghai
        required: false
        default: ""
        type: string
      catlass_ref:
        description: GitCode CATLASS branch or tag to build
        required: true
        default: master
        type: string

env:
  CANN_ROOT: /usr/local/Ascend/cann-9.1.0

permissions:
  contents: read

concurrency:
  group: dsl-wheel-${{ inputs.NPUIR_PIPELINE_POSTFIX || 'manual' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ascend-catlass-dsl wheel
    runs-on: [self-hosted, publish]
    timeout-minutes: 900
    env:
      CATLASS_REF: ${{ inputs.catlass_ref || 'master' }}
      SOURCE_DIR: ${{ github.workspace }}/.wheel-work/catlass-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      wheel_files: ${{ steps.metadata.outputs.wheel_files }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      npuir_sha: ${{ steps.npuir.outputs.source_sha }}
      npuir_postfix: ${{ steps.npuir.outputs.postfix }}
      npuir_cache_hit: ${{ steps.npuir.outputs.cache_hit }}

    steps:
      - name: Check out pipeline actions
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select worker-local NPUIR
        id: npuir
        uses: ./.github/actions/npuir-local-archive
        with:
          operation: lookup
          NPUIR_PIPELINE_POSTFIX: ${{ inputs.NPUIR_PIPELINE_POSTFIX || '' }}

      - name: Require completed NPUIR archive
        if: ${{ steps.npuir.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          NPUIR_POSTFIX: ${{ steps.npuir.outputs.postfix }}
          NPUIR_PATH: ${{ steps.npuir.outputs.path }}
        run: |
          echo "::error::NPUIR ${NPUIR_POSTFIX} is not available at ${NPUIR_PATH}"
          echo "Run the corresponding NPUIR pipeline first; wheel builds do not define NPUIR build commands."
          exit 1

      - name: Validate CANN
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${CANN_ROOT}/set_env.sh" ]]; then
            echo "::error::CANN environment script not found: ${CANN_ROOT}/set_env.sh"
            exit 1
          fi

      - name: Check out CATLASS from GitCode
        id: source
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -e "${SOURCE_DIR}" ]]; then
            echo "::error::Per-run source directory already exists: ${SOURCE_DIR}"
            exit 1
          fi
          mkdir -p "${SOURCE_DIR%/*}"

          askpass="${RUNNER_TEMP}/gitcode-askpass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          trap 'rm -f -- "${askpass}"' EXIT
          # The generated helper expands these variables when Git invokes it.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-oauth-basic" ;;' \
            '  *Password*) printf "%s\\n" "${GITCODE_TOKEN}" ;;' \
            'esac' > "${askpass}"
          chmod 700 "${askpass}"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git clone --quiet --depth 1 --branch "${CATLASS_REF}" \
              https://gitcode.com/cann/catlass.git "${SOURCE_DIR}"

          source_sha=$(git -C "${SOURCE_DIR}" rev-parse HEAD)
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "CATLASS: ${CATLASS_REF} @ ${source_sha}"

      - name: Build wheels
        shell: bash
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-*
          CIBW_SKIP: "*-win32 *-i686 *-ppc64le *-s390x *-musllinux_*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_CONTAINER_ENGINE: >-
            docker; create_args:
            -v ${{ env.CANN_ROOT }}:${{ env.CANN_ROOT }}:ro
            -v ${{ steps.npuir.outputs.path }}:/opt/AscendNPU-IR:ro
          CIBW_ENVIRONMENT: >-
            CMAKE_BUILD_TYPE=Release
            ASCEND_HOME_PATH=${{ env.CANN_ROOT }}
            CATLASS_DSL_PREBUILT_ASCENDNPU_IR=/opt/AscendNPU-IR
            CATLASS_DSL_ASCENDNPU_IR_ROOT=/opt/AscendNPU-IR
            CATLASS_DSL_ASCENDNPU_IR_INSTALL_DIR=/opt/AscendNPU-IR/build/install
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
            LDFLAGS=-fuse-ld=lld
            PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple
            PIP_TRUSTED_HOST=repo.huaweicloud.com
          CIBW_BEFORE_ALL: |
            set -eu

            printf '[global]\nindex-url = https://repo.huaweicloud.com/repository/pypi/simple\ntrusted-host = repo.huaweicloud.com\n' > /etc/pip.conf
            sed -i \
              -e 's|^mirrorlist=|#mirrorlist=|g' \
              -e 's|^# *baseurl=https://repo.almalinux.org/almalinux|baseurl=https://repo.huaweicloud.com/almalinux|g' \
              /etc/yum.repos.d/*.repo
            dnf clean all
            dnf install -y --nobest \
              "clang-19.1.7-2.module_el8.10.0+3990+33d0d926" \
              "lld-19.1.7-2.module_el8.10.0+3990+33d0d926"

            clang_version=$(/usr/bin/clang --version | sed -n "s/^clang version \([^ ]*\).*/\1/p" | head -1)
            lld_version=$(/usr/bin/ld.lld --version | sed -n "s/^LLD \([^ ]*\).*/\1/p" | head -1)
            case "${clang_version}:${lld_version}" in
              19.*:19.*) ;;
              *) echo "Expected clang/lld 19.x, got clang=${clang_version:-missing} lld=${lld_version:-missing}" >&2; exit 1 ;;
            esac
            /usr/bin/clang --version | head -1
            /usr/bin/clang++ --version | head -1
            /usr/bin/ld.lld --version | head -1

            test -f "${{ env.CANN_ROOT }}/set_env.sh"
            test -f /opt/AscendNPU-IR/build/install/lib/cmake/mlir/MLIRConfig.cmake
          PIP_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
          PIP_TRUSTED_HOST: repo.huaweicloud.com
        run: |
          set -euo pipefail

          cibw_venv="${RUNNER_TEMP}/cibuildwheel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "${cibw_venv}" ]]; then
            echo "::error::Per-run cibuildwheel environment already exists: ${cibw_venv}"
            exit 1
          fi

          python3 -m venv "${cibw_venv}"
          "${cibw_venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            "cibuildwheel==4.2.1"
          "${cibw_venv}/bin/python" -m cibuildwheel \
            "${SOURCE_DIR}/python/tla_dsl" \
            --output-dir "${SOURCE_DIR}/wheelhouse"

      - name: Collect wheel metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=("${SOURCE_DIR}"/wheelhouse/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "::error::cibuildwheel completed without producing any wheels"
            exit 1
          fi

          wheel_names=()
          for wheel in "${wheels[@]}"; do
            wheel_names+=("$(basename "${wheel}")")
          done

          wheel_files=$(IFS=,; echo "${wheel_names[*]}")
          build_date=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "wheel_files=${wheel_files}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${build_date}" >> "${GITHUB_OUTPUT}"

          echo "Built wheels:"
          ls -lh -- "${wheels[@]}"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsl-wheels
          path: ${{ env.SOURCE_DIR }}/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Clean up per-run wheel sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          expected_prefix="${GITHUB_WORKSPACE}/.wheel-work/catlass-${GITHUB_RUN_ID}-"
          case "${SOURCE_DIR}" in
            "${expected_prefix}"*) rm -rf -- "${SOURCE_DIR}" ;;
            *) echo "::error::Refusing to clean unexpected path: ${SOURCE_DIR}"; exit 1 ;;
          esac

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: dsl-wheels
          path: wheels

      - name: Create draft, attach wheels, and publish
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CATLASS_REF: ${{ inputs.catlass_ref || 'master' }}
          BUILD_DATE: ${{ needs.build.outputs.build_date }}
          WHEEL_FILES: ${{ needs.build.outputs.wheel_files }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          NPUIR_SHA: ${{ needs.build.outputs.npuir_sha }}
          NPUIR_POSTFIX: ${{ needs.build.outputs.npuir_postfix }}
          NPUIR_CACHE_HIT: ${{ needs.build.outputs.npuir_cache_hit }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(wheels/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "::error::Downloaded artifact contains no wheels"
            exit 1
          fi

          short_sha=${SOURCE_SHA:0:12}
          tag_name="dsl-release-$(date -u +%Y%m%d)-${short_sha}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          notes_file="${RUNNER_TEMP}/dsl-release-notes.md"

          cat > "${notes_file}" <<EOF
          # ascend-catlass-dsl wheels

          - Built on: ${BUILD_DATE}
          - CATLASS ref: ${CATLASS_REF}
          - CATLASS commit: ${SOURCE_SHA}
          - NPUIR pipeline postfix: ${NPUIR_POSTFIX}
          - AscendNPU-IR commit: ${NPUIR_SHA}
          - Reused existing NPUIR: ${NPUIR_CACHE_HIT}
          - CANN root: ${CANN_ROOT}
          - cibuildwheel: 4.2.1
          - Python: 3.10, 3.11, 3.12, 3.13

          Wheels: ${WHEEL_FILES}
          EOF

          gh release create "${tag_name}" "${wheels[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ascend-catlass-dsl wheels - ${BUILD_DATE}" \
            --notes-file "${notes_file}" \
            --draft

          gh release edit "${tag_name}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

          release_url=$(gh release view "${tag_name}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json url --jq .url)
          echo "release_url=${release_url}" >> "${GITHUB_OUTPUT}"

  notify:
    name: Build summary
    needs: [build, release]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
      WHEEL_FILES: ${{ needs.build.outputs.wheel_files }}
      BUILD_DATE: ${{ needs.build.outputs.build_date }}
      NPUIR_POSTFIX: ${{ needs.build.outputs.npuir_postfix }}
      NPUIR_CACHE_HIT: ${{ needs.build.outputs.npuir_cache_hit }}
      RELEASE_URL: ${{ needs.release.outputs.release_url }}

    steps:
      - name: Write build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## DSL wheel pipeline"
            echo
            echo "- Build: ${BUILD_RESULT}"
            echo "- Release: ${RELEASE_RESULT}"
            if [[ -n "${NPUIR_POSTFIX}" ]]; then
              echo "- NPUIR postfix: ${NPUIR_POSTFIX}"
              echo "- Reused existing NPUIR: ${NPUIR_CACHE_HIT}"
            fi

            if [[ "${BUILD_RESULT}" == success ]]; then
              echo "- Wheels: ${WHEEL_FILES}"
              echo "- Built on: ${BUILD_DATE}"
            fi

            if [[ "${RELEASE_RESULT}" == success ]]; then
              echo "- Release: ${RELEASE_URL}"
            elif [[ "${BUILD_RESULT}" == success ]]; then
              echo
              echo "> Wheels were built, but publishing failed. Check the release job; a draft release may remain."
            else
              echo
              echo "> The pipeline failed before a release could be published."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
