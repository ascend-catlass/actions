name: Build ascend-catlass-dsl wheels

on:
  workflow_call:
    inputs:
      catlass_ref:
        description: GitCode CATLASS branch or tag to build
        required: false
        default: master
        type: string
      package_version:
        description: Use dev to derive a nightly version, or pass the exact stable version from a release tag
        required: false
        default: dev
        type: string
    outputs:
      source_sha:
        description: Exact CATLASS commit used for the build
        value: ${{ jobs.resolve.outputs.source_sha }}
      npuir_sha:
        description: Exact AscendNPU-IR gitlink used for the build
        value: ${{ jobs.resolve.outputs.npuir_sha }}
      package_version:
        description: Resolved PEP 440 package version
        value: ${{ jobs.resolve.outputs.package_version }}
    secrets:
      GITCODE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      catlass_ref:
        description: GitCode CATLASS branch or tag to build
        required: true
        default: master
        type: string
      package_version:
        description: Use dev to derive a nightly version, or pass an exact MAJOR.MINOR.PATCH version with the matching v-tag ref
        required: false
        default: dev
        type: string

run-name: Build ascend-catlass-dsl ${{ inputs.package_version || 'dev' }} from ${{ inputs.catlass_ref || 'master' }}

env:
  CANN_ROOT: /usr/local/Ascend/cann-9.1.0
  NPUIR_BUILD_FINGERPRINT: clang-19.1.7+lld-19.1.7
  NPUIR_BUILD_CONTRACT: clang19-lld19-release-rtti-assert-triton-zstd-off-v1
  NPUIR_BASELINE_DATE: "20260720"
  NPUIR_LEGACY_POSTFIX: "20260720"

permissions:
  contents: read

concurrency:
  group: dsl-wheel-build-${{ inputs.catlass_ref || 'master' }}-${{ inputs.package_version || 'dev' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve CATLASS and NPUIR revisions
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      npuir_sha: ${{ steps.source.outputs.npuir_sha }}
      package_version: ${{ steps.source.outputs.package_version }}
    env:
      CATLASS_REF: ${{ inputs.catlass_ref || 'master' }}
      REQUESTED_VERSION: ${{ inputs.package_version || 'dev' }}

    steps:
      - name: Resolve exact source revisions and package version
        id: source
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail

          source_dir="${RUNNER_TEMP}/catlass-resolve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          askpass="${RUNNER_TEMP}/gitcode-askpass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          trap 'rm -rf -- "${source_dir}"; rm -f -- "${askpass}"' EXIT
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-oauth-basic" ;;' \
            '  *Password*) printf "%s\\n" "${GITCODE_TOKEN}" ;;' \
            'esac' > "${askpass}"
          chmod 700 "${askpass}"

          case "${REQUESTED_VERSION}" in
            dev)
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                git clone --quiet --depth 1 --branch "${CATLASS_REF}" \
                  https://gitcode.com/cann/catlass.git "${source_dir}"
              latest_release_tag=$(
                GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                  git ls-remote --tags --refs https://gitcode.com/cann/catlass.git 'v*' |
                  awk '{sub("^refs/tags/", "", $2); print $2}' |
                  sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' |
                  sort -V |
                  tail -1
              )
              if [[ -z "${latest_release_tag}" ]]; then
                echo "::error::No stable vMAJOR.MINOR.PATCH tag found in CATLASS SCM"
                exit 1
              fi
              stable_version=${latest_release_tag#v}
              IFS=. read -r major minor patch <<< "${stable_version}"
              build_day=$(TZ=Asia/Shanghai date +%Y%m%d)
              package_version="${major}.${minor}.$((10#${patch} + 1)).dev${build_day}"
              ;;
            *)
              if [[ ! "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::package_version must be dev or MAJOR.MINOR.PATCH, got: ${REQUESTED_VERSION}"
                exit 1
              fi
              expected_tag="v${REQUESTED_VERSION}"
              if [[ "${CATLASS_REF}" != "${expected_tag}" ]]; then
                echo "::error::Stable version ${REQUESTED_VERSION} must build the matching GitCode tag ${expected_tag}, got: ${CATLASS_REF}"
                exit 1
              fi
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                git ls-remote --exit-code --refs \
                  https://gitcode.com/cann/catlass.git "refs/tags/${expected_tag}" >/dev/null
              git init --quiet "${source_dir}"
              git -C "${source_dir}" remote add origin https://gitcode.com/cann/catlass.git
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                git -C "${source_dir}" fetch --quiet --depth 1 origin \
                  "refs/tags/${expected_tag}:refs/tags/${expected_tag}"
              git -C "${source_dir}" checkout --quiet --detach "refs/tags/${expected_tag}^{commit}"
              package_version=${REQUESTED_VERSION}
              ;;
          esac

          source_sha=$(git -C "${source_dir}" rev-parse HEAD)
          submodule_entry=$(git -C "${source_dir}" ls-tree HEAD python/tla_dsl/3rdparty/AscendNPU-IR)
          read -r submodule_mode submodule_type npuir_sha submodule_path <<< "${submodule_entry}"
          if [[ "${submodule_mode}" != 160000 || "${submodule_type}" != commit || \
                ! "${npuir_sha}" =~ ^[0-9a-f]{40}$ || \
                "${submodule_path}" != python/tla_dsl/3rdparty/AscendNPU-IR ]]; then
            echo "::error::CATLASS ${CATLASS_REF} does not contain a valid AscendNPU-IR gitlink"
            exit 1
          fi
          {
            echo "source_sha=${source_sha}"
            echo "npuir_sha=${npuir_sha}"
            echo "package_version=${package_version}"
          } >> "${GITHUB_OUTPUT}"
          echo "CATLASS ${source_sha} requires NPUIR ${npuir_sha}; package version ${package_version}"

  npuir:
    name: Prepare NPUIR on build workers
    needs: resolve
    uses: ./.github/workflows/build-ascendnpu-ir-20260720.yml
    with:
      ref: ${{ needs.resolve.outputs.npuir_sha }}
      branch: feature/regbase
      use_mirror: true
      build_jobs: 64

  build:
    name: Build ascend-catlass-dsl wheel (${{ matrix.target_arch }})
    needs: [resolve, npuir]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: x86_64
            runner_arch: X64
          - target_arch: aarch64
            runner_arch: ARM64
    runs-on: [self-hosted, publish, "${{ matrix.runner_arch }}"]
    timeout-minutes: 900
    env:
      NPUIR_TARGET_ARCH: ${{ matrix.target_arch }}
      SOURCE_DIR: ${{ github.workspace }}/.wheel-work/catlass-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out workflow definitions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate CANN
        shell: bash
        run: |
          set -euo pipefail
          actual_arch=$(uname -m)
          if [[ "${actual_arch}" != "${NPUIR_TARGET_ARCH}" ]]; then
            echo "::error::Runner architecture is ${actual_arch}, expected ${NPUIR_TARGET_ARCH}"
            exit 1
          fi
          if [[ ! -f "${CANN_ROOT}/set_env.sh" ]]; then
            echo "::error::CANN environment script not found: ${CANN_ROOT}/set_env.sh"
            exit 1
          fi

      - name: Check out CATLASS from GitCode
        id: source
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_NPUIR_SHA: ${{ needs.resolve.outputs.npuir_sha }}
        run: |
          set -euo pipefail

          if [[ -e "${SOURCE_DIR}" ]]; then
            echo "::error::Per-run source directory already exists: ${SOURCE_DIR}"
            exit 1
          fi
          mkdir -p "${SOURCE_DIR%/*}"

          askpass="${RUNNER_TEMP}/gitcode-askpass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          trap 'rm -f -- "${askpass}"' EXIT
          # The generated helper expands these variables when Git invokes it.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-oauth-basic" ;;' \
            '  *Password*) printf "%s\\n" "${GITCODE_TOKEN}" ;;' \
            'esac' > "${askpass}"
          chmod 700 "${askpass}"

          git init --quiet "${SOURCE_DIR}"
          git -C "${SOURCE_DIR}" remote add origin https://gitcode.com/cann/catlass.git
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${SOURCE_DIR}" fetch --quiet --depth 1 origin "${RESOLVED_SOURCE_SHA}"
          git -C "${SOURCE_DIR}" checkout --quiet --detach FETCH_HEAD

          source_sha=$(git -C "${SOURCE_DIR}" rev-parse HEAD)
          submodule_entry=$(git -C "${SOURCE_DIR}" ls-tree HEAD python/tla_dsl/3rdparty/AscendNPU-IR)
          read -r submodule_mode submodule_type npuir_sha submodule_path <<< "${submodule_entry}"
          if [[ "${source_sha}" != "${RESOLVED_SOURCE_SHA}" || \
                "${submodule_mode}" != 160000 || "${submodule_type}" != commit || \
                ! "${npuir_sha}" =~ ^[0-9a-f]{40}$ || \
                "${submodule_path}" != python/tla_dsl/3rdparty/AscendNPU-IR || \
                "${npuir_sha}" != "${RESOLVED_NPUIR_SHA}" ]]; then
            echo "::error::Checked-out CATLASS metadata differs from the resolved dependency chain"
            exit 1
          fi
          {
            echo "source_sha=${source_sha}"
            echo "npuir_sha=${npuir_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "CATLASS exact commit: ${source_sha}"
          echo "Required NPUIR commit: ${npuir_sha}"

      - name: Select worker-local NPUIR for CATLASS gitlink
        id: npuir
        uses: ./.github/actions/npuir-local-archive
        with:
          operation: lookup
          source_sha: ${{ steps.source.outputs.npuir_sha }}
          target_arch: ${{ env.NPUIR_TARGET_ARCH }}
          build_contract: ${{ env.NPUIR_BUILD_CONTRACT }}
          baseline_date: ${{ env.NPUIR_BASELINE_DATE }}
          build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}
          legacy_postfix: ${{ env.NPUIR_LEGACY_POSTFIX }}
          legacy_build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}

      - name: Require completed matching NPUIR archive
        if: ${{ steps.npuir.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          NPUIR_SHA: ${{ steps.source.outputs.npuir_sha }}
          NPUIR_ARCHIVE_KEY: ${{ steps.npuir.outputs.archive_key }}
          NPUIR_PATH: ${{ steps.npuir.outputs.path }}
          NPUIR_BUILD_CONTRACT: ${{ env.NPUIR_BUILD_CONTRACT }}
        run: |
          echo "::error::NPUIR preparation completed, but ${NPUIR_SHA} (${NPUIR_BUILD_CONTRACT}) is not available on this worker at ${NPUIR_PATH}"
          echo "Required archive key: ${NPUIR_ARCHIVE_KEY}"
          echo "Check that the NPUIR and wheel jobs for this architecture use the same worker-local archive."
          exit 1

      - name: Configure native build parallelism
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${NPUIR_TARGET_ARCH}" == aarch64 ]]; then
            parallel_jobs=$(nproc)
          else
            parallel_jobs=64
          fi
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${parallel_jobs}" >> "${GITHUB_ENV}"
          echo "${NPUIR_TARGET_ARCH} wheel build parallel jobs: ${parallel_jobs}"

      - name: Build wheels
        shell: bash
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-*
          CIBW_ARCHS_LINUX: ${{ matrix.target_arch }}
          CIBW_ENVIRONMENT_PASS_LINUX: CMAKE_BUILD_PARALLEL_LEVEL
          CIBW_SKIP: "*-win32 *-i686 *-ppc64le *-s390x *-musllinux_*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_CONTAINER_ENGINE: >-
            docker; create_args:
            -v ${{ env.CANN_ROOT }}:${{ env.CANN_ROOT }}:ro
            -v ${{ steps.npuir.outputs.path }}:/opt/AscendNPU-IR:ro
          CIBW_ENVIRONMENT: >-
            CMAKE_BUILD_TYPE=Release
            ASCEND_HOME_PATH=${{ env.CANN_ROOT }}
            CATLASS_DSL_PREBUILT_ASCENDNPU_IR=/opt/AscendNPU-IR
            CATLASS_DSL_ASCENDNPU_IR_ROOT=/opt/AscendNPU-IR
            CATLASS_DSL_ASCENDNPU_IR_INSTALL_DIR=/opt/AscendNPU-IR/build/install
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
            LDFLAGS=-fuse-ld=lld
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ASCEND_CATLASS_DSL=${{ needs.resolve.outputs.package_version }}
            PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple
            PIP_TRUSTED_HOST=repo.huaweicloud.com
          CIBW_BEFORE_ALL: |
            set -eu

            printf '[global]\nindex-url = https://repo.huaweicloud.com/repository/pypi/simple\ntrusted-host = repo.huaweicloud.com\n' > /etc/pip.conf
            sed -i \
              -e 's|^mirrorlist=|#mirrorlist=|g' \
              -e 's|^# *baseurl=https://repo.almalinux.org/almalinux|baseurl=https://repo.huaweicloud.com/almalinux|g' \
              /etc/yum.repos.d/*.repo
            dnf clean all
            dnf install -y --nobest \
              "clang-19.1.7-2.module_el8.10.0+3990+33d0d926" \
              "lld-19.1.7-2.module_el8.10.0+3990+33d0d926"

            clang_version=$(/usr/bin/clang --version | sed -n "s/^clang version \([^ ]*\).*/\1/p" | head -1)
            lld_version=$(/usr/bin/ld.lld --version | sed -n "s/^LLD \([^ ]*\).*/\1/p" | head -1)
            case "${clang_version}:${lld_version}" in
              19.*:19.*) ;;
              *) echo "Expected clang/lld 19.x, got clang=${clang_version:-missing} lld=${lld_version:-missing}" >&2; exit 1 ;;
            esac
            /usr/bin/clang --version | head -1
            /usr/bin/clang++ --version | head -1
            /usr/bin/ld.lld --version | head -1

            test -f "${{ env.CANN_ROOT }}/set_env.sh"
            test -f /opt/AscendNPU-IR/build/install/lib/cmake/mlir/MLIRConfig.cmake
          PIP_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
          PIP_TRUSTED_HOST: repo.huaweicloud.com
        run: |
          set -euo pipefail

          cibw_venv="${RUNNER_TEMP}/cibuildwheel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "${cibw_venv}" ]]; then
            echo "::error::Per-run cibuildwheel environment already exists: ${cibw_venv}"
            exit 1
          fi

          host_python=""
          for candidate in python3.11 python3.12 python3.13 python3.14 python3.15 python3; do
            candidate_path=$(command -v "${candidate}" || true)
            if [[ -n "${candidate_path}" ]] && \
               "${candidate_path}" -c 'import sys; raise SystemExit(sys.version_info < (3, 11))'; then
              host_python="${candidate_path}"
              break
            fi
          done
          if [[ -z "${host_python}" ]]; then
            echo "::error::cibuildwheel 4.2.1 requires an installed host Python >= 3.11"
            exit 1
          fi
          echo "Using host Python: $("${host_python}" --version 2>&1) (${host_python})"

          "${host_python}" -m venv "${cibw_venv}"
          "${cibw_venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            "cibuildwheel==4.2.1"
          "${cibw_venv}/bin/python" -m cibuildwheel \
            "${SOURCE_DIR}/python/tla_dsl" \
            --output-dir "${SOURCE_DIR}/wheelhouse"

      - name: Collect wheel metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.package_version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          NPUIR_SHA: ${{ steps.npuir.outputs.source_sha }}
          NPUIR_ARCHIVE_KEY: ${{ steps.npuir.outputs.archive_key }}
          NPUIR_BUILD_CONTRACT: ${{ steps.npuir.outputs.build_contract }}
          NPUIR_ARCHIVE_BASELINE_DATE: ${{ steps.npuir.outputs.baseline_date }}
          NPUIR_LEGACY_CACHE_HIT: ${{ steps.npuir.outputs.legacy_cache_hit }}
          NPUIR_CACHE_HIT: ${{ steps.npuir.outputs.cache_hit }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=("${SOURCE_DIR}"/wheelhouse/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "::error::cibuildwheel completed without producing any wheels"
            exit 1
          fi

          wheel_names=()
          for wheel in "${wheels[@]}"; do
            wheel_name=$(basename "${wheel}")
            case "${wheel_name}" in
              "ascend_catlass_dsl-${EXPECTED_VERSION}-"*.whl) ;;
              *) echo "::error::Unexpected wheel version: ${wheel_name}; expected ${EXPECTED_VERSION}"; exit 1 ;;
            esac
            case "${wheel_name}" in
              *_"${NPUIR_TARGET_ARCH}".whl) ;;
              *) echo "::error::Unexpected wheel architecture: ${wheel_name}; expected ${NPUIR_TARGET_ARCH}"; exit 1 ;;
            esac
            wheel_names+=("${wheel_name}")
          done

          wheel_files=$(IFS=,; echo "${wheel_names[*]}")
          build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          metadata_file="${SOURCE_DIR}/wheelhouse/release-metadata-${NPUIR_TARGET_ARCH}.json"
          npuir_notes="${SOURCE_DIR}/wheelhouse/npuir-metadata-${NPUIR_TARGET_ARCH}.md"
          printf '{"package_version":"%s","source_sha":"%s","build_date":"%s","wheel_files":"%s"}\n' \
            "${EXPECTED_VERSION}" "${SOURCE_SHA}" "${build_date}" "${wheel_files}" > "${metadata_file}"
          {
            echo "### ${NPUIR_TARGET_ARCH}"
            echo
            echo "- AscendNPU-IR commit: ${NPUIR_SHA}"
            echo "- Archive key: ${NPUIR_ARCHIVE_KEY}"
            echo "- Build contract: ${NPUIR_BUILD_CONTRACT}"
            echo "- Baseline date: ${NPUIR_ARCHIVE_BASELINE_DATE}"
            echo "- Reused existing NPUIR: ${NPUIR_CACHE_HIT}"
            echo "- Used transitional dated archive: ${NPUIR_LEGACY_CACHE_HIT}"
            echo "- Wheels: ${wheel_files}"
          } > "${npuir_notes}"

          echo "Built wheels:"
          ls -lh -- "${wheels[@]}"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsl-wheels-${{ matrix.target_arch }}
          path: |
            ${{ env.SOURCE_DIR }}/wheelhouse/*.whl
            ${{ env.SOURCE_DIR }}/wheelhouse/release-metadata-${{ matrix.target_arch }}.json
            ${{ env.SOURCE_DIR }}/wheelhouse/npuir-metadata-${{ matrix.target_arch }}.md
          if-no-files-found: error
          retention-days: 30

      - name: Clean up per-run wheel sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          expected_prefix="${GITHUB_WORKSPACE}/.wheel-work/catlass-${GITHUB_RUN_ID}-"
          case "${SOURCE_DIR}" in
            "${expected_prefix}"*) rm -rf -- "${SOURCE_DIR}" ;;
            *) echo "::error::Refusing to clean unexpected path: ${SOURCE_DIR}"; exit 1 ;;
          esac

  notify:
    name: Build summary
    needs: [resolve, npuir, build]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      NPUIR_RESULT: ${{ needs.npuir.result }}
      PACKAGE_VERSION: ${{ needs.resolve.outputs.package_version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      NPUIR_SHA: ${{ needs.resolve.outputs.npuir_sha }}

    steps:
      - name: Write build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## ascend-catlass-dsl build"
            echo
            echo "- Build: ${BUILD_RESULT}"
            echo "- NPUIR preparation: ${NPUIR_RESULT}"
            if [[ "${BUILD_RESULT}" == success ]]; then
              echo "- Package version: ${PACKAGE_VERSION}"
              echo "- CATLASS commit: ${SOURCE_SHA}"
              echo "- AscendNPU-IR commit: ${NPUIR_SHA}"
              echo "- Artifacts: dsl-wheels-x86_64, dsl-wheels-aarch64"
            else
              echo
              echo "> The build did not produce a complete wheel set."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
