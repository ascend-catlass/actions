name: Build ascend-catlass-dsl wheel

on:
  schedule:
    # Every day at 01:00 Asia/Shanghai (17:00 UTC).
    - cron: "0 17 * * *"
  workflow_call:
    inputs:
      catlass_ref:
        description: GitCode CATLASS branch or tag to build
        required: false
        default: master
        type: string
      dsl_version:
        description: Nightly package version override; empty derives the next patch from the latest stable SCM tag
        required: false
        default: ""
        type: string
      release_kind:
        description: Build channel (nightly or stable)
        required: false
        default: nightly
        type: string
      release_tag:
        description: Exact CATLASS vMAJOR.MINOR.PATCH tag for a stable release
        required: false
        default: ""
        type: string
    secrets:
      GITCODE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      catlass_ref:
        description: GitCode CATLASS branch or tag to build
        required: true
        default: master
        type: string
      dsl_version:
        description: Nightly package version override; empty derives the next patch from the latest stable SCM tag
        required: false
        default: ""
        type: string

run-name: ${{ inputs.release_kind == 'stable' && format('Release DSL wheel {0}', inputs.release_tag) || 'Daily DSL wheel' }}

env:
  CANN_ROOT: /usr/local/Ascend/cann-9.1.0
  NPUIR_BUILD_FINGERPRINT: clang-19.1.7+lld-19.1.7
  NPUIR_BUILD_CONTRACT: clang19-lld19-release-rtti-assert-triton-zstd-off-v1
  NPUIR_BASELINE_DATE: "20260720"
  NPUIR_LEGACY_POSTFIX: "20260720"

permissions:
  contents: read

concurrency:
  group: dsl-wheel-${{ inputs.release_kind == 'stable' && inputs.release_tag || inputs.catlass_ref || 'master' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ascend-catlass-dsl wheel (${{ matrix.target_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: x86_64
            runner_arch: X64
          - target_arch: aarch64
            runner_arch: ARM64
    runs-on: [self-hosted, publish, "${{ matrix.runner_arch }}"]
    timeout-minutes: 900
    env:
      CATLASS_REF: ${{ inputs.catlass_ref || 'master' }}
      RELEASE_KIND: ${{ inputs.release_kind || 'nightly' }}
      RELEASE_TAG: ${{ inputs.release_tag || '' }}
      NPUIR_TARGET_ARCH: ${{ matrix.target_arch }}
      SOURCE_DIR: ${{ github.workspace }}/.wheel-work/catlass-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out workflow definitions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate CANN
        shell: bash
        run: |
          set -euo pipefail
          actual_arch=$(uname -m)
          if [[ "${actual_arch}" != "${NPUIR_TARGET_ARCH}" ]]; then
            echo "::error::Runner architecture is ${actual_arch}, expected ${NPUIR_TARGET_ARCH}"
            exit 1
          fi
          if [[ ! -f "${CANN_ROOT}/set_env.sh" ]]; then
            echo "::error::CANN environment script not found: ${CANN_ROOT}/set_env.sh"
            exit 1
          fi

      - name: Check out CATLASS from GitCode
        id: source
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -e "${SOURCE_DIR}" ]]; then
            echo "::error::Per-run source directory already exists: ${SOURCE_DIR}"
            exit 1
          fi
          mkdir -p "${SOURCE_DIR%/*}"

          askpass="${RUNNER_TEMP}/gitcode-askpass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          trap 'rm -f -- "${askpass}"' EXIT
          # The generated helper expands these variables when Git invokes it.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-oauth-basic" ;;' \
            '  *Password*) printf "%s\\n" "${GITCODE_TOKEN}" ;;' \
            'esac' > "${askpass}"
          chmod 700 "${askpass}"

          case "${RELEASE_KIND}" in
            stable)
              if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Stable releases require an exact vMAJOR.MINOR.PATCH tag, got: ${RELEASE_TAG:-empty}"
                exit 1
              fi
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                git ls-remote --exit-code --refs \
                  https://gitcode.com/cann/catlass.git "refs/tags/${RELEASE_TAG}" >/dev/null
              git init --quiet "${SOURCE_DIR}"
              git -C "${SOURCE_DIR}" remote add origin https://gitcode.com/cann/catlass.git
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                git -C "${SOURCE_DIR}" fetch --quiet --depth 1 origin \
                  "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              git -C "${SOURCE_DIR}" checkout --quiet --detach "refs/tags/${RELEASE_TAG}^{commit}"
              ;;
            nightly)
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                git clone --quiet --depth 1 --branch "${CATLASS_REF}" \
                  https://gitcode.com/cann/catlass.git "${SOURCE_DIR}"
              ;;
            *)
              echo "::error::release_kind must be nightly or stable, got: ${RELEASE_KIND}"
              exit 1
              ;;
          esac

          source_sha=$(git -C "${SOURCE_DIR}" rev-parse HEAD)
          submodule_entry=$(git -C "${SOURCE_DIR}" ls-tree HEAD python/tla_dsl/3rdparty/AscendNPU-IR)
          read -r submodule_mode submodule_type npuir_sha submodule_path <<< "${submodule_entry}"
          if [[ "${submodule_mode}" != 160000 || "${submodule_type}" != commit || \
                ! "${npuir_sha}" =~ ^[0-9a-f]{40}$ || \
                "${submodule_path}" != python/tla_dsl/3rdparty/AscendNPU-IR ]]; then
            echo "::error::CATLASS ${RELEASE_TAG:-${CATLASS_REF}} does not contain a valid AscendNPU-IR gitlink"
            exit 1
          fi

          latest_release_tag=""
          if [[ "${RELEASE_KIND}" == nightly ]]; then
            latest_release_tag=$(
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                git ls-remote --tags --refs https://gitcode.com/cann/catlass.git 'v*' |
                awk '{sub("^refs/tags/", "", $2); print $2}' |
                sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' |
                sort -V |
                tail -1
            )
            if [[ -z "${latest_release_tag}" ]]; then
              echo "::error::No stable vMAJOR.MINOR.PATCH tag found in CATLASS SCM"
              exit 1
            fi
          fi
          {
            echo "source_sha=${source_sha}"
            echo "npuir_sha=${npuir_sha}"
            echo "latest_release_tag=${latest_release_tag}"
          } >> "${GITHUB_OUTPUT}"
          echo "CATLASS: ${RELEASE_TAG:-${CATLASS_REF}} @ ${source_sha}"
          echo "Required NPUIR commit: ${npuir_sha}"
          if [[ -n "${latest_release_tag}" ]]; then
            echo "Latest stable CATLASS tag: ${latest_release_tag}"
          fi

      - name: Select worker-local NPUIR for CATLASS gitlink
        id: npuir
        uses: ./.github/actions/npuir-local-archive
        with:
          operation: lookup
          source_sha: ${{ steps.source.outputs.npuir_sha }}
          target_arch: ${{ env.NPUIR_TARGET_ARCH }}
          build_contract: ${{ env.NPUIR_BUILD_CONTRACT }}
          baseline_date: ${{ env.NPUIR_BASELINE_DATE }}
          build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}
          legacy_postfix: ${{ env.NPUIR_LEGACY_POSTFIX }}
          legacy_build_fingerprint: ${{ env.NPUIR_BUILD_FINGERPRINT }}

      - name: Require completed matching NPUIR archive
        if: ${{ steps.npuir.outputs.cache_hit != 'true' }}
        shell: bash
        env:
          NPUIR_SHA: ${{ steps.source.outputs.npuir_sha }}
          NPUIR_ARCHIVE_KEY: ${{ steps.npuir.outputs.archive_key }}
          NPUIR_PATH: ${{ steps.npuir.outputs.path }}
          NPUIR_BUILD_CONTRACT: ${{ env.NPUIR_BUILD_CONTRACT }}
        run: |
          echo "::error::NPUIR ${NPUIR_SHA} (${NPUIR_BUILD_CONTRACT}) is not available at ${NPUIR_PATH}"
          echo "Required archive key: ${NPUIR_ARCHIVE_KEY}"
          echo "Run the NPUIR pipeline for this exact commit/architecture/build contract first; wheel builds never compile NPUIR."
          exit 1

      - name: Resolve package version
        id: version
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.dsl_version || '' }}
          LATEST_RELEASE_TAG: ${{ steps.source.outputs.latest_release_tag }}
          RELEASE_KIND: ${{ inputs.release_kind || 'nightly' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_KIND}" == stable ]]; then
            version=${RELEASE_TAG#v}
            source="exact tag ${RELEASE_TAG}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Stable package version must come from vMAJOR.MINOR.PATCH, got: ${RELEASE_TAG}"
              exit 1
            fi
          else
            build_day=$(TZ=Asia/Shanghai date +%Y%m%d)
            if [[ -n "${VERSION_OVERRIDE}" ]]; then
              version=${VERSION_OVERRIDE}
              source=manual
            else
              stable_version=${LATEST_RELEASE_TAG#v}
              IFS=. read -r major minor patch <<< "${stable_version}"
              version="${major}.${minor}.$((10#${patch} + 1)).dev${build_day}"
              source="SCM ${LATEST_RELEASE_TAG}"
            fi
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]{8}$ ]]; then
              echo "::error::Nightly version must match MAJOR.MINOR.PATCH.devYYYYMMDD, got: ${version}"
              exit 1
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "DSL package version: ${version} (${source})"

      - name: Configure native build parallelism
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${NPUIR_TARGET_ARCH}" == aarch64 ]]; then
            parallel_jobs=$(nproc)
          else
            parallel_jobs=64
          fi
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${parallel_jobs}" >> "${GITHUB_ENV}"
          echo "${NPUIR_TARGET_ARCH} wheel build parallel jobs: ${parallel_jobs}"

      - name: Build wheels
        shell: bash
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-*
          CIBW_ARCHS_LINUX: ${{ matrix.target_arch }}
          CIBW_ENVIRONMENT_PASS_LINUX: CMAKE_BUILD_PARALLEL_LEVEL
          CIBW_SKIP: "*-win32 *-i686 *-ppc64le *-s390x *-musllinux_*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_CONTAINER_ENGINE: >-
            docker; create_args:
            -v ${{ env.CANN_ROOT }}:${{ env.CANN_ROOT }}:ro
            -v ${{ steps.npuir.outputs.path }}:/opt/AscendNPU-IR:ro
          CIBW_ENVIRONMENT: >-
            CMAKE_BUILD_TYPE=Release
            ASCEND_HOME_PATH=${{ env.CANN_ROOT }}
            CATLASS_DSL_PREBUILT_ASCENDNPU_IR=/opt/AscendNPU-IR
            CATLASS_DSL_ASCENDNPU_IR_ROOT=/opt/AscendNPU-IR
            CATLASS_DSL_ASCENDNPU_IR_INSTALL_DIR=/opt/AscendNPU-IR/build/install
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
            LDFLAGS=-fuse-ld=lld
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ASCEND_CATLASS_DSL=${{ steps.version.outputs.version }}
            PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple
            PIP_TRUSTED_HOST=repo.huaweicloud.com
          CIBW_BEFORE_ALL: |
            set -eu

            printf '[global]\nindex-url = https://repo.huaweicloud.com/repository/pypi/simple\ntrusted-host = repo.huaweicloud.com\n' > /etc/pip.conf
            sed -i \
              -e 's|^mirrorlist=|#mirrorlist=|g' \
              -e 's|^# *baseurl=https://repo.almalinux.org/almalinux|baseurl=https://repo.huaweicloud.com/almalinux|g' \
              /etc/yum.repos.d/*.repo
            dnf clean all
            dnf install -y --nobest \
              "clang-19.1.7-2.module_el8.10.0+3990+33d0d926" \
              "lld-19.1.7-2.module_el8.10.0+3990+33d0d926"

            clang_version=$(/usr/bin/clang --version | sed -n "s/^clang version \([^ ]*\).*/\1/p" | head -1)
            lld_version=$(/usr/bin/ld.lld --version | sed -n "s/^LLD \([^ ]*\).*/\1/p" | head -1)
            case "${clang_version}:${lld_version}" in
              19.*:19.*) ;;
              *) echo "Expected clang/lld 19.x, got clang=${clang_version:-missing} lld=${lld_version:-missing}" >&2; exit 1 ;;
            esac
            /usr/bin/clang --version | head -1
            /usr/bin/clang++ --version | head -1
            /usr/bin/ld.lld --version | head -1

            test -f "${{ env.CANN_ROOT }}/set_env.sh"
            test -f /opt/AscendNPU-IR/build/install/lib/cmake/mlir/MLIRConfig.cmake
          PIP_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
          PIP_TRUSTED_HOST: repo.huaweicloud.com
        run: |
          set -euo pipefail

          cibw_venv="${RUNNER_TEMP}/cibuildwheel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "${cibw_venv}" ]]; then
            echo "::error::Per-run cibuildwheel environment already exists: ${cibw_venv}"
            exit 1
          fi

          python3 -m venv "${cibw_venv}"
          "${cibw_venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            "cibuildwheel==4.2.1"
          "${cibw_venv}/bin/python" -m cibuildwheel \
            "${SOURCE_DIR}/python/tla_dsl" \
            --output-dir "${SOURCE_DIR}/wheelhouse"

      - name: Collect wheel metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          NPUIR_SHA: ${{ steps.npuir.outputs.source_sha }}
          NPUIR_ARCHIVE_KEY: ${{ steps.npuir.outputs.archive_key }}
          NPUIR_BUILD_CONTRACT: ${{ steps.npuir.outputs.build_contract }}
          NPUIR_ARCHIVE_BASELINE_DATE: ${{ steps.npuir.outputs.baseline_date }}
          NPUIR_LEGACY_CACHE_HIT: ${{ steps.npuir.outputs.legacy_cache_hit }}
          NPUIR_CACHE_HIT: ${{ steps.npuir.outputs.cache_hit }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=("${SOURCE_DIR}"/wheelhouse/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "::error::cibuildwheel completed without producing any wheels"
            exit 1
          fi

          wheel_names=()
          for wheel in "${wheels[@]}"; do
            wheel_name=$(basename "${wheel}")
            case "${wheel_name}" in
              "ascend_catlass_dsl-${EXPECTED_VERSION}-"*.whl) ;;
              *) echo "::error::Unexpected wheel version: ${wheel_name}; expected ${EXPECTED_VERSION}"; exit 1 ;;
            esac
            case "${wheel_name}" in
              *_"${NPUIR_TARGET_ARCH}".whl) ;;
              *) echo "::error::Unexpected wheel architecture: ${wheel_name}; expected ${NPUIR_TARGET_ARCH}"; exit 1 ;;
            esac
            wheel_names+=("${wheel_name}")
          done

          wheel_files=$(IFS=,; echo "${wheel_names[*]}")
          build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          metadata_file="${SOURCE_DIR}/wheelhouse/release-metadata-${NPUIR_TARGET_ARCH}.json"
          npuir_notes="${SOURCE_DIR}/wheelhouse/npuir-metadata-${NPUIR_TARGET_ARCH}.md"
          printf '{"package_version":"%s","source_sha":"%s","build_date":"%s","wheel_files":"%s"}\n' \
            "${EXPECTED_VERSION}" "${SOURCE_SHA}" "${build_date}" "${wheel_files}" > "${metadata_file}"
          {
            echo "### ${NPUIR_TARGET_ARCH}"
            echo
            echo "- AscendNPU-IR commit: ${NPUIR_SHA}"
            echo "- Archive key: ${NPUIR_ARCHIVE_KEY}"
            echo "- Build contract: ${NPUIR_BUILD_CONTRACT}"
            echo "- Baseline date: ${NPUIR_ARCHIVE_BASELINE_DATE}"
            echo "- Reused existing NPUIR: ${NPUIR_CACHE_HIT}"
            echo "- Used transitional dated archive: ${NPUIR_LEGACY_CACHE_HIT}"
            echo "- Wheels: ${wheel_files}"
          } > "${npuir_notes}"

          echo "Built wheels:"
          ls -lh -- "${wheels[@]}"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsl-wheels-${{ matrix.target_arch }}
          path: |
            ${{ env.SOURCE_DIR }}/wheelhouse/*.whl
            ${{ env.SOURCE_DIR }}/wheelhouse/release-metadata-${{ matrix.target_arch }}.json
            ${{ env.SOURCE_DIR }}/wheelhouse/npuir-metadata-${{ matrix.target_arch }}.md
          if-no-files-found: error
          retention-days: 30

      - name: Clean up per-run wheel sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          expected_prefix="${GITHUB_WORKSPACE}/.wheel-work/catlass-${GITHUB_RUN_ID}-"
          case "${SOURCE_DIR}" in
            "${expected_prefix}"*) rm -rf -- "${SOURCE_DIR}" ;;
            *) echo "::error::Refusing to clean unexpected path: ${SOURCE_DIR}"; exit 1 ;;
          esac

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
      package_version: ${{ steps.publish.outputs.package_version }}
      wheel_files: ${{ steps.publish.outputs.wheel_files }}
      source_sha: ${{ steps.publish.outputs.source_sha }}
      build_date: ${{ steps.publish.outputs.build_date }}

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dsl-wheels-*
          path: wheels
          merge-multiple: true

      - name: Create draft, attach wheels, and publish
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CATLASS_REF: ${{ inputs.catlass_ref || 'master' }}
          RELEASE_KIND: ${{ inputs.release_kind || 'nightly' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(wheels/*.whl)
          metadata_files=(wheels/release-metadata-*.json)
          npuir_notes=(wheels/npuir-metadata-*.md)
          if (( ${#wheels[@]} == 0 )); then
            echo "::error::Downloaded artifact contains no wheels"
            exit 1
          fi
          if (( ${#metadata_files[@]} != 2 || ${#npuir_notes[@]} != 2 )); then
            echo "::error::Expected x86_64 and aarch64 metadata, found ${#metadata_files[@]} metadata files and ${#npuir_notes[@]} note files"
            exit 1
          fi

          metadata_value() {
            jq -r --arg key "$1" '.[$key]' "$2"
          }
          PACKAGE_VERSION=$(metadata_value package_version "${metadata_files[0]}")
          SOURCE_SHA=$(metadata_value source_sha "${metadata_files[0]}")
          BUILD_DATE=$(metadata_value build_date "${metadata_files[0]}")
          if [[ ! "${PACKAGE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]{8})?$ || ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid common release metadata"
            exit 1
          fi
          for metadata_file in "${metadata_files[@]:1}"; do
            if [[ "$(metadata_value package_version "${metadata_file}")" != "${PACKAGE_VERSION}" || \
                  "$(metadata_value source_sha "${metadata_file}")" != "${SOURCE_SHA}" ]]; then
              echo "::error::Architecture builds used different CATLASS commits or package versions"
              exit 1
            fi
          done

          wheel_names=()
          for wheel in "${wheels[@]}"; do
            wheel_names+=("$(basename "${wheel}")")
          done
          WHEEL_FILES=$(IFS=,; echo "${wheel_names[*]}")

          short_sha=${SOURCE_SHA:0:12}
          if [[ "${RELEASE_KIND}" == stable ]]; then
            tag_name="dsl-${RELEASE_TAG}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}" >/dev/null 2>&1; then
              echo "::error::Release tag already exists and will not be overwritten: ${tag_name}"
              exit 1
            fi
            catlass_source=${RELEASE_TAG}
          else
            tag_name="dsl-v${PACKAGE_VERSION}-${short_sha}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            catlass_source=${CATLASS_REF}
          fi
          notes_file="${RUNNER_TEMP}/dsl-release-notes.md"

          cat > "${notes_file}" <<EOF
          # ascend-catlass-dsl wheels

          - Built on: ${BUILD_DATE}
          - Release kind: ${RELEASE_KIND}
          - Package version: ${PACKAGE_VERSION}
          - CATLASS ref: ${catlass_source}
          - CATLASS commit: ${SOURCE_SHA}
          - CANN root: ${CANN_ROOT}
          - cibuildwheel: 4.2.1
          - Python: 3.10, 3.11, 3.12, 3.13

          Wheels: ${WHEEL_FILES}

          ## NPUIR by architecture
          EOF
          for note_file in "${npuir_notes[@]}"; do
            cat "${note_file}" >> "${notes_file}"
            echo >> "${notes_file}"
          done

          gh release create "${tag_name}" "${wheels[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ascend-catlass-dsl ${PACKAGE_VERSION}" \
            --notes-file "${notes_file}" \
            --draft

          gh release edit "${tag_name}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

          release_url=$(gh release view "${tag_name}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json url --jq .url)
          {
            echo "release_url=${release_url}"
            echo "package_version=${PACKAGE_VERSION}"
            echo "wheel_files=${WHEEL_FILES}"
            echo "source_sha=${SOURCE_SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "${GITHUB_OUTPUT}"

  notify:
    name: Build summary
    needs: [build, release]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
      WHEEL_FILES: ${{ needs.release.outputs.wheel_files }}
      BUILD_DATE: ${{ needs.release.outputs.build_date }}
      RELEASE_URL: ${{ needs.release.outputs.release_url }}
      PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}

    steps:
      - name: Write build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            if [[ "${PACKAGE_VERSION}" =~ \.dev([0-9]{8})$ ]]; then
              echo "## DSL wheel ${BASH_REMATCH[1]}"
            else
              echo "## DSL wheel pipeline"
            fi
            echo
            echo "- Build: ${BUILD_RESULT}"
            echo "- Release: ${RELEASE_RESULT}"
            if [[ "${BUILD_RESULT}" == success ]]; then
              echo "- Package version: ${PACKAGE_VERSION}"
              echo "- Wheels: ${WHEEL_FILES}"
              echo "- Built on: ${BUILD_DATE}"
            fi

            if [[ "${RELEASE_RESULT}" == success ]]; then
              echo "- Release: ${RELEASE_URL}"
            elif [[ "${BUILD_RESULT}" == success ]]; then
              echo
              echo "> Wheels were built, but publishing failed. Check the release job; a draft release may remain."
            else
              echo
              echo "> The pipeline failed before a release could be published."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
