name: Build and Release ascend-catlass-dsl wheel

on:
  schedule:
    # 01:00 Asia/Shanghai (17:00 UTC)
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dsl-wheel
  cancel-in-progress: false

jobs:
  build:
    name: Build ascend-catlass-dsl wheel
    runs-on: [self-hosted, nondocker]
    timeout-minutes: 180

    outputs:
      wheel_files: ${{ steps.build.outputs.wheel_files }}
      build_date: ${{ steps.build.outputs.build_date }}

    steps:
      - name: Check out catlass from GitCode
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          
          git clone --quiet --depth 1 --branch master \
            https://${GITCODE_TOKEN}:x-oauth-basic@gitcode.com/cann/catlass.git \
            catlass-source

      - name: Locate NPUIR and CANN on host
        shell: bash
        run: |
          set -euo pipefail

          # CANN toolkit root: prefer the loaded environment, fall back to the default install path
          ASCEND_HOME_PATH="${ASCEND_HOME_PATH:-/usr/local/Ascend/ascend-toolkit/latest}"
          # Prebuilt AscendNPU-IR source/install tree on the host
          NPUIR_ROOT="${CATLASS_DSL_PREBUILT_ASCENDNPU_IR:-/opt/AscendNPU-IR}"

          [ -d "${ASCEND_HOME_PATH}" ] || {
            echo "::error::CANN not found at ${ASCEND_HOME_PATH}. Set ASCEND_HOME_PATH or CATLASS_DSL_CANN_ROOT."
            exit 1
          }
          [ -f "${NPUIR_ROOT}/build/install/lib/cmake/mlir/MLIRConfig.cmake" ] || {
            echo "::error::AscendNPU-IR install tree not found at ${NPUIR_ROOT}/build/install. Set CATLASS_DSL_PREBUILT_ASCENDNPU_IR."
            exit 1
          }

          echo "ASCEND_HOME_PATH=${ASCEND_HOME_PATH}" >> "${GITHUB_ENV}"
          echo "NPUIR_ROOT=${NPUIR_ROOT}" >> "${GITHUB_ENV}"
          echo "CANN:   ${ASCEND_HOME_PATH}"
          echo "NPUIR:  ${NPUIR_ROOT}"

      - name: Build wheels (NPUIR/CANN mounted via docker)
        id: build
        shell: bash
        working-directory: catlass-source
        env:
          WHEEL_CONTAINER: dsl-wheel-build
        run: |
          set -euo pipefail

          mkdir -p wheelhouse
          docker rm -f "${WHEEL_CONTAINER}" >/dev/null 2>&1 || true

          # Mount the host NPUIR and CANN trees into the build container at the
          # same paths, so no in-container install/clone of these deps is needed.
          docker run -d --name "${WHEEL_CONTAINER}" \
            -v "${ASCEND_HOME_PATH}:${ASCEND_HOME_PATH}" \
            -v "${NPUIR_ROOT}:${NPUIR_ROOT}" \
            -v "${GITHUB_WORKSPACE}/catlass-source:/workspace/catlass" \
            -v "${GITHUB_WORKSPACE}/catlass-source/wheelhouse:/wheelhouse" \
            -w /workspace/catlass/python/tla_dsl \
            quay.io/pypa/manylinux_2_28_x86_64 \
            sleep infinity

          trap 'docker rm -f "${WHEEL_CONTAINER}" >/dev/null 2>&1 || true' EXIT

          for tag in cp310 cp311 cp312 cp313; do
            echo "== Building ${tag} =="
            docker exec \
              -e ASCEND_HOME_PATH="${ASCEND_HOME_PATH}" \
              -e CATLASS_DSL_ASCENDNPU_IR_ROOT="${NPUIR_ROOT}" \
              -e CATLASS_DSL_ASCENDNPU_IR_INSTALL_DIR="${NPUIR_ROOT}/build/install" \
              -e CMAKE_BUILD_TYPE=Release \
              "${WHEEL_CONTAINER}" bash -c "
                set -euo pipefail
                PYBIN=/opt/python/${tag}-${tag}/bin
                CC_BIN=\$(command -v clang-19 || command -v clang)
                CXX_BIN=\$(command -v clang++-19 || command -v clang++)
                export CC=\"\${CC_BIN}\" CXX=\"\${CXX_BIN}\"
                echo \"-- Using compiler: \${CC} / \${CXX}\"
                \"\${PYBIN}/python\" -m pip install --quiet --upgrade pip setuptools wheel auditwheel
                \"\${PYBIN}/python\" -m pip wheel . --no-deps -w /tmp/wheels
                \"\${PYBIN}/python\" -m auditwheel repair /tmp/wheels/*.whl -w /wheelhouse
              "
          done

          docker rm -f "${WHEEL_CONTAINER}" >/dev/null 2>&1 || true
          trap - EXIT

          # Collect wheel file names
          wheel_files=$(cd wheelhouse && ls -1 *.whl | tr '\n' ' ')
          echo "wheel_files=${wheel_files}" >> "${GITHUB_OUTPUT}"

          # Set build date
          build_date=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "build_date=${build_date}" >> "${GITHUB_OUTPUT}"

          # Log the built wheels
          echo "Built wheels:"
          ls -lh wheelhouse/

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsl-wheels
          path: catlass-source/wheelhouse/*.whl
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() }}

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: dsl-wheels
          path: ./wheels

      - name: Create Release Tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          
          # Create a tag with date and time
          tag_name="dsl-release-$(date -u +%Y%m%d-%H%M%S)"
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          release_name: "ascend-catlass-dsl wheels - ${{ needs.build.outputs.build_date }}"
          body: |
            # ascend-catlass-dsl wheels release
            
            Built on: ${{ needs.build.outputs.build_date }}
            
            ## Included wheels
            
            ${{ needs.build.outputs.wheel_files }}
            
            These wheels were automatically built from the `master` branch using `cibuildwheel`.
            
            Supported Python versions: 3.10, 3.11, 3.12, 3.13
          draft: false
          prerelease: false

      - name: Upload wheels to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          set -euo pipefail
          
          cd wheels
          
          for wheel_file in *.whl; do
            echo "Uploading ${wheel_file}..."
            
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: token ${GITHUB_TOKEN}" \
              --header "Content-Type: application/octet-stream" \
              --data-binary @"${wheel_file}" \
              "${UPLOAD_URL%\{*}?name=${wheel_file}"
            
            echo "Successfully uploaded ${wheel_file}"
          done

  notify:
    name: Notify on build completion
    needs: [build, release]
    runs-on: ubuntu-latest
    if: ${{ always() }}

    steps:
      - name: Build Summary
        shell: bash
        run: |
          echo "## Build Summary"
          echo "Build status: ${{ needs.build.result }}"
          echo "Release status: ${{ needs.release.result }}"
          echo ""
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ Successfully built wheels: ${{ needs.build.outputs.wheel_files }}"
            echo "📦 Release created for: ${{ needs.build.outputs.build_date }}"
          else
            echo "❌ Build failed. Check logs for details."
          fi