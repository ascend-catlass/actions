name: "Community 2 · PR CI passed reminder"
run-name: "PR #${{ inputs.pr_number }} CI review reminder"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in cann/catlass on AtomGit
        required: true
        type: string

  workflow_call:
    inputs:
      pr_number:
        description: Pull request number in cann/catlass on AtomGit
        required: true
        type: string
    secrets:
      ATOMGIT_TOKEN:
        required: false
      GITCODE_TOKEN:
        required: false

permissions:
  contents: read

# Serialize redeliveries so the comment check runs after the previous write.
concurrency:
  group: reply-atomgit-ci-passed-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  remind:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ascend-catlass/actions/.github/actions/atomgit-ci-passed@main
        with:
          pr-number: ${{ inputs.pr_number }}
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
