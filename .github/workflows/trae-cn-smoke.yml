name: Test TRAE CN stage

on:
  workflow_dispatch:
    inputs:
      prompt_file:
        description: UTF-8 prompt file in this repository
        type: string
        default: .github/prompts/trae-cn-smoke.md
      expected_version:
        description: Optional exact version of the preinstalled China CLI 2.0
        type: string
        default: ''

permissions:
  contents: read

jobs:
  adapter-tests:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify adapter including Linux process cleanup
        run: python3 -m unittest discover -s tests -p test_trae_cn_stage.py -v
  smoke:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: adapter-tests
    # Provision a dedicated, disposable worker with the official China CLI 2.0.
    # Do not use a privileged NPU/build host to execute outside contributors' code.
    runs-on: [self-hosted, Linux, trae-cn]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run repository prompt
        id: trae
        uses: ./.github/actions/trae-cn
        with:
          trae-pat: ${{ secrets.TRAE_CN_PAT }}
          host: ${{ vars.TRAE_CN_HOST }}
          expected-version: ${{ inputs.expected_version }}
          prompt-file: ${{ inputs.prompt_file }}
          sandbox: read-only
      - name: Save stage results, including failed execution logs
        if: ${{ always() && steps.trae.outputs.result-directory != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trae-cn-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.trae.outputs.result-directory }}
          if-no-files-found: error
          retention-days: 7
