name: "Community 3 · Simple Issue fix (TRAE CN)"
run-name: "TRAE CN fix #${{ inputs.issue_number }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: CATLASS Issue number
        type: string
        required: true
      validation_command:
        description: Maintainer-chosen verification command to run in the checkout (required before publishing)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: community-fix-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TASK_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out shared Action helpers
        uses: actions/checkout@v4
        with:
          repository: yuantao313/actions
          ref: 02defff4ec04b38b33adfaec06bcb1406f5a2150
          path: shared_actions
          persist-credentials: false
      - name: Prepare pinned source and task context
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
        run: python3 -m scripts.community_tasks prepare --mode fix --number "$TASK_NUMBER"
      - name: Analyze with TRAE CN
        id: trae
        uses: ./.github/actions/catlass-ai
        with:
          pat: ${{ secrets.TRAE_CN_PAT }}
          working-directory: _task-source
          prompt-file: .automation-context/prompt.md
          output-schema-file: .automation-context/schema.json
          timeout-seconds: '1200'
      - name: Preserve proposal
        env:
          TRAE_RESULT: ${{ steps.trae.outputs.result-directory }}
        run: |
          mkdir -p _task-result/analysis
          cp "$TRAE_RESULT/response.md" "$TRAE_RESULT/result.json" _task-result/analysis/
      - name: Upload proposal
        uses: actions/upload-artifact@v4
        with:
          name: issue-fix-proposal
          path: _task-result/
          retention-days: 7
      - name: Save model evidence
        if: ${{ always() && steps.trae.outputs.result-directory != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-fix-model-evidence
          path: ${{ steps.trae.outputs.result-directory }}
          retention-days: 7

  validate:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: fix
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out shared Action helpers
        uses: actions/checkout@v4
        with:
          repository: yuantao313/actions
          ref: 02defff4ec04b38b33adfaec06bcb1406f5a2150
          path: shared_actions
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue-fix-proposal
          path: _task-result/
      - name: Validate on a fresh runner without model or publishing credentials
        env:
          TASK_NUMBER: ${{ inputs.issue_number }}
          VALIDATION_COMMAND: ${{ inputs.validation_command }}
        run: python3 -m scripts.community_tasks validate --mode fix --number "$TASK_NUMBER"
      - name: Save validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-fix-validation
          path: |
            _task-result/validation.json
            _task-result/validation.log
          retention-days: 7

  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out shared Action helpers
        uses: actions/checkout@v4
        with:
          repository: yuantao313/actions
          ref: 02defff4ec04b38b33adfaec06bcb1406f5a2150
          path: shared_actions
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue-fix-proposal
          path: _task-result/
      - uses: actions/download-artifact@v4
        with:
          name: issue-fix-validation
          path: _task-result/
      - name: Recheck and publish the validated proposal
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          TASK_NUMBER: ${{ inputs.issue_number }}
          VALIDATION_COMMAND: ${{ inputs.validation_command }}
        run: python3 -m scripts.community_tasks publish --mode fix --number "$TASK_NUMBER"
      - name: Save publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-fix-publication
          path: _task-result/publication.json
          retention-days: 7
