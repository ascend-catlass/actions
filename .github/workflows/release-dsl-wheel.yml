name: Release ascend-catlass from AtomGit tag

on:
  workflow_dispatch:
    inputs:
      catlass_tag:
        description: Existing AtomGit CATLASS vMAJOR.MINOR.PATCH tag to build and publish
        required: true
        type: string
      artifact_run_id:
        description: Optional prior release run ID whose validated bundle should be republished without rebuilding
        required: false
        type: string

run-name: Release ascend-catlass ${{ inputs.catlass_tag }}

permissions:
  contents: read

concurrency:
  group: release-dsl-wheel-${{ inputs.catlass_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Verify AtomGit release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      source_sha: ${{ steps.tag.outputs.source_sha }}

    steps:
      - name: Require an existing exact CATLASS tag
        id: tag
        shell: bash
        env:
          CATLASS_TAG: ${{ inputs.catlass_tag }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "${CATLASS_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH, got: ${CATLASS_TAG}"
            exit 1
          fi

          source_dir="${RUNNER_TEMP}/catlass-tag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          askpass="${RUNNER_TEMP}/atomgit-tag-askpass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          trap 'rm -rf -- "${source_dir}"; rm -f -- "${askpass}"' EXIT
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-oauth-basic" ;;' \
            '  *Password*) printf "%s\\n" "${ATOMGIT_TOKEN}" ;;' \
            'esac' > "${askpass}"
          chmod 700 "${askpass}"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git ls-remote --exit-code --refs \
              https://atomgit.com/cann/catlass.git "refs/tags/${CATLASS_TAG}" >/dev/null
          git init --quiet "${source_dir}"
          git -C "${source_dir}" remote add origin https://atomgit.com/cann/catlass.git
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${source_dir}" fetch --quiet --depth 1 origin \
              "refs/tags/${CATLASS_TAG}:refs/tags/${CATLASS_TAG}"
          source_sha=$(git -C "${source_dir}" rev-parse "refs/tags/${CATLASS_TAG}^{commit}")
          version=${CATLASS_TAG#v}
          {
            echo "tag=${CATLASS_TAG}"
            echo "version=${version}"
            echo "source_sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "Verified AtomGit tag ${CATLASS_TAG} at ${source_sha} before starting the build"

  build:
    name: Build release wheels
    needs: preflight
    if: ${{ github.ref == 'refs/heads/main' && (inputs.artifact_run_id == '') }}
    uses: ./.github/workflows/build-dsl-wheel.yml
    with:
      catlass_ref: ${{ needs.preflight.outputs.tag }}
      package_version: ${{ needs.preflight.outputs.version }}
    secrets: inherit

  prepare:
    name: Validate release bundle
    needs: [preflight, build]
    if: ${{ github.ref == 'refs/heads/main' && (inputs.artifact_run_id == '') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out shared Action helpers
        uses: actions/checkout@v4
        with:
          repository: yuantao313/actions
          ref: 02defff4ec04b38b33adfaec06bcb1406f5a2150
          path: shared_actions
          persist-credentials: false

      - name: Download architecture wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsl-wheels-*
          path: wheels
          merge-multiple: true

      - name: Prepare validated wheel bundle
        uses: ./.github/actions/prepare-wheel-bundle
        with:
          version: ${{ needs.preflight.outputs.version }}
          source-sha: ${{ needs.preflight.outputs.source_sha }}
          source-ref: ${{ needs.preflight.outputs.tag }}
          compatibility-package: 'true'

      - name: Upload validated release bundle
        uses: actions/upload-artifact@v4
        with:
          name: dsl-release-bundle-${{ needs.preflight.outputs.version }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish main and compatibility packages to PyPI
    needs: [preflight, prepare]
    if: ${{ github.ref == 'refs/heads/main' && (always() && needs.preflight.result == 'success' && (needs.prepare.result == 'success' || inputs.artifact_run_id != '')) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ascend-catlass/${{ needs.preflight.outputs.version }}/
    permissions:
      actions: read
      id-token: write
      contents: read
    outputs:
      main_result: ${{ steps.publish-main.outcome }}
      compat_result: ${{ steps.publish-compat.outcome }}

    steps:
      - name: Check out release validation tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download validated release bundle
        uses: actions/download-artifact@v4
        with:
          name: dsl-release-bundle-${{ needs.preflight.outputs.version }}
          path: release-bundle
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate bundle and check PyPI retry compatibility
        uses: ./.github/actions/prepare-wheel-bundle
        with:
          operation: validate-pypi
          version: ${{ needs.preflight.outputs.version }}
          source-sha: ${{ needs.preflight.outputs.source_sha }}
          source-ref: ${{ needs.preflight.outputs.tag }}
          compatibility-package: 'true'

      - name: Publish ascend-catlass distributions
        id: publish-main
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/wheels
          print-hash: true
          skip-existing: true

      - name: Publish matching ascend-catlass-dsl compatibility distribution
        id: publish-compat
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/compat-wheels
          print-hash: true
          skip-existing: true

  publish-atomgit:
    name: Publish wheels to AtomGit Release
    needs: [preflight, prepare]
    if: ${{ github.ref == 'refs/heads/main' && (always() && needs.preflight.result == 'success' && (needs.prepare.result == 'success' || inputs.artifact_run_id != '')) }}
    runs-on: [self-hosted, Linux, ascend-catlass-dsl-build, X64]
    timeout-minutes: 60
    environment:
      name: gitcode-release
      url: https://atomgit.com/cann/catlass/releases/${{ needs.preflight.outputs.tag }}
    permissions:
      actions: read
      contents: read

    steps:
      # Route git clones through a public accelerator when reachable, else fall
      # back to direct GitHub; the self-hosted lab link to github.com is flaky.
      - name: Accelerate GitHub clones on the slow self-hosted link
        shell: bash
        run: |
          set -euo pipefail
          mirror="https://ghfast.top/https://github.com/"
          if curl -fsS -o /dev/null --max-time 8 "https://ghfast.top/" 2>/dev/null; then
            git config --global url."${mirror}".insteadOf "https://github.com/"
            echo "GitHub clones will use the ghfast.top accelerator"
          else
            git config --global --unset-all url."${mirror}".insteadOf 2>/dev/null || true
            echo "Accelerator unreachable; falling back to direct GitHub"
          fi
      # This job runs on a self-hosted worker behind a slow cross-border link.
      # A bare checkout has no retry and no slow-link tolerance, so a stall
      # fails the publish after the wheels and the PyPI release already
      # succeeded.
      - name: Check out release tooling
        uses: actions/checkout@v4
        timeout-minutes: 20
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github
            scripts
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1024"
          GIT_HTTP_LOW_SPEED_TIME: "120"
      - name: Check out shared Action helpers
        uses: actions/checkout@v4
        timeout-minutes: 20
        with:
          repository: yuantao313/actions
          ref: 02defff4ec04b38b33adfaec06bcb1406f5a2150
          path: shared_actions
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            atomgit-release
            _lib
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1024"
          GIT_HTTP_LOW_SPEED_TIME: "120"

      - name: Download validated release bundle
        uses: actions/download-artifact@v4
        with:
          name: dsl-release-bundle-${{ needs.preflight.outputs.version }}
          path: release-bundle
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate downloaded release bundle
        uses: ./.github/actions/prepare-wheel-bundle
        with:
          operation: validate
          version: ${{ needs.preflight.outputs.version }}
          source-sha: ${{ needs.preflight.outputs.source_sha }}
          source-ref: ${{ needs.preflight.outputs.tag }}
          compatibility-package: 'true'

      - name: Attach wheels to the corresponding AtomGit tag release
        uses: ./.github/actions/atomgit-release
        with:
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          tag: ${{ needs.preflight.outputs.tag }}
          version: ${{ needs.preflight.outputs.version }}
          bundle: release-bundle

  summary:
    name: Release summary
    needs: [preflight, build, prepare, publish-pypi, publish-atomgit]
    if: ${{ github.ref == 'refs/heads/main' && (always()) }}
    runs-on: ubuntu-latest

    steps:
      - name: Write release summary
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
          MAIN_PYPI_RESULT: ${{ needs.publish-pypi.outputs.main_result || 'skipped' }}
          COMPAT_PYPI_RESULT: ${{ needs.publish-pypi.outputs.compat_result || 'skipped' }}
          ATOMGIT_RESULT: ${{ needs.publish-atomgit.result }}
        run: |
          {
            echo "## ascend-catlass ${VERSION}"
            echo
            echo "- AtomGit tag: ${TAG}"
            echo "- CATLASS commit: ${SOURCE_SHA}"
            echo "- Build: ${BUILD_RESULT}"
            echo "- Bundle validation: ${PREPARE_RESULT}"
            echo "- PyPI: ${PYPI_RESULT}"
            echo "- ascend-catlass PyPI: ${MAIN_PYPI_RESULT}"
            echo "- ascend-catlass-dsl compatibility PyPI: ${COMPAT_PYPI_RESULT}"
            echo "- AtomGit Release: ${ATOMGIT_RESULT}"
            if [[ "${MAIN_PYPI_RESULT}" == success ]]; then
              echo "- PyPI URL: https://pypi.org/project/ascend-catlass/${VERSION}/"
            fi
            if [[ "${COMPAT_PYPI_RESULT}" == success ]]; then
              echo "- Compatibility PyPI URL: https://pypi.org/project/ascend-catlass-dsl/${VERSION}/"
            fi
            if [[ "${ATOMGIT_RESULT}" == success ]]; then
              echo "- AtomGit Release: https://atomgit.com/cann/catlass/releases/${TAG}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
