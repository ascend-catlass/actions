name: "Community 4 · Inline PR review (TRAE CN)"
run-name: "TRAE CN review #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: CATLASS PR number
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: community-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TASK_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out shared Action helpers
        uses: actions/checkout@v4
        with:
          repository: yuantao313/actions
          ref: 02defff4ec04b38b33adfaec06bcb1406f5a2150
          path: shared_actions
          persist-credentials: false
      - name: Prepare pinned source and task context
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
        run: python3 -m scripts.community_tasks prepare --mode review --number "$TASK_NUMBER"
      - name: Analyze with TRAE CN
        id: trae
        uses: ./.github/actions/catlass-ai
        with:
          pat: ${{ secrets.TRAE_CN_PAT }}
          working-directory: _task-source
          prompt-file: .automation-context/prompt.md
          output-schema-file: .automation-context/schema.json
          timeout-seconds: '1200'
      - name: Validate and publish
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          TRAE_RESULT: ${{ steps.trae.outputs.result-directory }}
        run: python3 -m scripts.community_tasks publish --mode review --number "$TASK_NUMBER"
      - name: Save task evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: community-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _task-result/
            ${{ steps.trae.outputs.result-directory }}
          retention-days: 7
