name: "Community 5 · Issue type label (TRAE CN)"
run-name: Classify Issue #${{ inputs.issue_number }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number in cann/catlass
        required: true
        type: string
      publish:
        description: Apply the selected existing label
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: atomgit-issue-label-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  classify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yuantao313/actions
          ref: 02defff4ec04b38b33adfaec06bcb1406f5a2150
          path: shared_actions
          persist-credentials: false
      - name: Prepare Issue and existing category labels
        id: prepare
        uses: ./.github/actions/atomgit-issue-label
        with:
          operation: prepare
          issue-number: ${{ inputs.issue_number }}
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
      - name: Choose the most appropriate Issue kind
        id: model
        if: ${{ steps.prepare.outputs.analyze == 'true' }}
        uses: ./.github/actions/catlass-ai
        with:
          pat: ${{ secrets.TRAE_CN_PAT }}
          working-directory: .
          prompt-file: _issue-label-result/prompt.md
          output-schema-file: _issue-label-result/schema.json
      - name: Recheck, add one label and read it back
        if: ${{ steps.prepare.outputs.analyze == 'true' && steps.model.outputs.status == 'success' && inputs.publish }}
        uses: ./.github/actions/atomgit-issue-label
        with:
          operation: publish
          token: ${{ secrets.ATOMGIT_TOKEN || secrets.GITCODE_TOKEN }}
          stage-result: ${{ steps.model.outputs.result-directory }}
      - name: Save classification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-label-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _issue-label-result/
            ${{ steps.model.outputs.result-directory }}
          if-no-files-found: ignore
          retention-days: 7
