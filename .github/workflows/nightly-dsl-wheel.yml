name: Daily CATLASS wheels and documentation

on:
  schedule:
    # Every day at 01:00 Asia/Shanghai (17:00 UTC).
    - cron: "0 17 * * *"
  workflow_dispatch:

run-name: Daily CATLASS wheels and documentation

permissions:
  contents: read

concurrency:
  group: daily-dsl-wheel
  cancel-in-progress: false

jobs:

  readthedocs:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Trigger Read the Docs (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: catlass
            integration_id: '331563'
            token_secret: READTHEDOCS_ZH_WEBHOOK_TOKEN
          - project: catlass-en
            integration_id: '331564'
            token_secret: READTHEDOCS_EN_WEBHOOK_TOKEN
    steps:
      - name: Trigger latest documentation build
        env:
          RTD_WEBHOOK_TOKEN: ${{ secrets[matrix.token_secret] }}
          RTD_PROJECT: ${{ matrix.project }}
          RTD_INTEGRATION_ID: ${{ matrix.integration_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RTD_WEBHOOK_TOKEN}" ]]; then
            echo "::error::Read the Docs webhook token is missing for ${RTD_PROJECT}."
            exit 1
          fi
          status=$(curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            --data-urlencode 'branches=latest' \
            --data-urlencode "token=${RTD_WEBHOOK_TOKEN}" \
            "https://app.readthedocs.org/api/v2/webhook/${RTD_PROJECT}/${RTD_INTEGRATION_ID}/")
          if [[ "${status}" != 2?? ]]; then
            echo "::error::Read the Docs rejected ${RTD_PROJECT} (HTTP ${status})."
            exit 1
          fi
          echo "Read the Docs accepted ${RTD_PROJECT}/latest (HTTP ${status})."
          echo "- Read the Docs accepted [${RTD_PROJECT}/latest](https://app.readthedocs.org/projects/${RTD_PROJECT}/builds/); check the build result there." >> "${GITHUB_STEP_SUMMARY}"

  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Build nightly wheels
    uses: ./.github/workflows/build-dsl-wheel.yml
    with:
      catlass_ref: master
      package_version: dev
    secrets: inherit

  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Validate nightly bundle
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out publishing tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download architecture wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsl-wheels-*
          path: wheels
          merge-multiple: true

      - name: Validate wheels and generate checksums
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_wheel_bundle.py \
            --input-dir wheels \
            --output-dir release-bundle \
            --version "${PACKAGE_VERSION}" \
            --source-sha "${SOURCE_SHA}" \
            --source-ref master
          python3 -m pip install --disable-pip-version-check twine
          python3 -m twine check release-bundle/wheels/*.whl

      - name: Upload validated nightly bundle
        uses: actions/upload-artifact@v4
        with:
          name: dsl-nightly-release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 30

  publish-github:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Publish nightly GitHub Release
    needs: [build, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated nightly bundle
        uses: actions/download-artifact@v4
        with:
          name: dsl-nightly-release-bundle
          path: release-bundle

      - name: Publish wheels for the package index
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(release-bundle/wheels/*.whl)
          if (( ${#wheels[@]} != 8 )); then
            echo "::error::Expected eight validated wheels, found ${#wheels[@]}"
            exit 1
          fi
          short_sha=${SOURCE_SHA:0:12}
          tag_name="dsl-v${PACKAGE_VERSION}-${short_sha}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "${tag_name}" \
            "${wheels[@]}" \
            release-bundle/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ascend-catlass-dsl ${PACKAGE_VERSION}" \
            --notes-file release-bundle/release-notes.md \
            --draft
          gh release edit "${tag_name}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

          release_url=$(gh release view "${tag_name}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json url --jq .url)
          {
            echo "## Daily ascend-catlass-dsl ${PACKAGE_VERSION}"
            echo
            echo "- CATLASS commit: ${SOURCE_SHA}"
            echo "- GitHub Release: ${release_url}"
            echo "- Package index: https://ascend-catlass.github.io/simple/ascend-catlass-dsl/"
          } >> "${GITHUB_STEP_SUMMARY}"
