name: "AtomGit PR test · compatible entry"
run-name: "PR #${{ inputs.pr_number }} Test"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in cann/catlass on AtomGit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/test-atomgit-pr.yml
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets: inherit
