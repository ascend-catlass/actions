name: Analyze and reply to a GitCode Issue with Trae China
run-name: Trae China reply to ${{ inputs.issue_url || 'https://gitcode.com/cann/catlass/issues/739' }}

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: GitCode Issue URL
        type: string
        required: true
        default: https://gitcode.com/cann/catlass/issues/739
      publish:
        description: Publish or update the short automated reply
        type: boolean
        default: true
  push:
    # Explicit integration-test branch for the user-authorized Issue #739 test.
    branches: [codex/trae-cn-issue-739]
    paths:
      - .github/actions/trae-cn/**
      - .github/workflows/reply-gitcode-issue.yml
      - .github/prompts/gitcode-issue-reply.md
      - scripts/gitcode_issue_reply.py
      - tests/test_gitcode_issue_reply.py

permissions:
  contents: read

concurrency:
  group: trae-cn-issue-${{ inputs.issue_url || 'https://gitcode.com/cann/catlass/issues/739' }}
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ISSUE_URL: ${{ inputs.issue_url || 'https://gitcode.com/cann/catlass/issues/739' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify adapters
        run: |
          python3 -m unittest discover -s tests -p test_trae_cn_stage.py -v
          python3 -m unittest discover -s tests -p test_gitcode_issue_reply.py -v
      - name: Install pinned official China enterprise CLI
        shell: bash
        env:
          TRAECLI_CHANNEL: tob
          TRAECLI_VERSION: 0.209.1-tob
          TRAECLI_INSTALL_ASSUME_YES: '1'
          TRAECLI_INSTALL_MIGRATE_BREW: '0'
          TRAECLI_INSTALL_REMOVE_COCO: '0'
        run: |
          set -euo pipefail
          installer="${RUNNER_TEMP}/trae-install.sh"
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 120 https://trae.cn/trae-cli/install_v2.sh -o "$installer"
          echo "d86c84066bb493d40f6d671733b6243dddb9c39df1a9084676470736548b5be8  $installer" | sha256sum --check
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Checkout Issue repository and prepare prompt
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          source_url=$(python3 -c 'import os; from scripts.gitcode_issue_reply import parse_url; owner,repo,_=parse_url(os.environ["ISSUE_URL"]); print(f"https://gitcode.com/{owner}/{repo}.git")')
          git clone --depth 200 "$source_url" _issue-source
          python3 scripts/gitcode_issue_reply.py prepare --issue-url "$ISSUE_URL" --worktree _issue-source --template .github/prompts/gitcode-issue-reply.md --output _issue-result
      - name: Analyze Issue and source
        id: trae
        uses: ./.github/actions/trae-cn
        with:
          trae-pat: ${{ secrets.TRAE_CN_PAT }}
          host: ${{ vars.TRAE_CN_HOST }}
          expected-version: 0.209.1
          working-directory: _issue-source
          prompt-file: .trae-issue-context/prompt.md
          sandbox: read-only
          timeout-seconds: '900'
      - name: Publish and read back the short reply
        if: ${{ steps.trae.outputs.status == 'success' && (github.event_name == 'push' || inputs.publish) }}
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RESPONSE_FILE: ${{ steps.trae.outputs.response-file }}
          WORKFLOW_RUN_URL: https://github.com/ascend-catlass/actions/actions/runs/${{ github.run_id }}
        run: python3 scripts/gitcode_issue_reply.py publish --issue-url "$ISSUE_URL" --output _issue-result --response "$RESPONSE_FILE"
      - name: Save analysis and publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitcode-issue-reply-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _issue-result/
            ${{ steps.trae.outputs.result-directory }}
          retention-days: 7
