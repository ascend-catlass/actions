name: Analyze and reply to a GitCode Issue with Trae China
run-name: Trae China reply to ${{ inputs.issue_url || 'https://gitcode.com/cann/catlass/issues/739' }}

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: GitCode Issue URL
        type: string
        required: true
        default: https://gitcode.com/cann/catlass/issues/739
      publish:
        description: Publish or update the short automated reply
        type: boolean
        default: true
  push:
    # Explicit integration-test branch for the user-authorized Issue #739 test.
    branches: [codex/trae-cn-issue-739]
    paths:
      - .github/actions/trae-cn/**
      - .github/actions/gitcode-*/**
      - .github/workflows/reply-gitcode-issue.yml
      - .github/prompts/gitcode-issue-reply.md
      - scripts/gitcode_issue_reply.py
      - scripts/gitcode_api.py
      - tests/test_gitcode_issue_reply.py

permissions:
  contents: read

concurrency:
  group: trae-cn-issue-${{ inputs.issue_url || 'https://gitcode.com/cann/catlass/issues/739' }}
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ISSUE_URL: ${{ inputs.issue_url || 'https://gitcode.com/cann/catlass/issues/739' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify adapters
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 -m unittest discover -s tests -p test_trae_cn_stage.py -v
          python3 -m unittest discover -s tests -p test_gitcode_issue_reply.py -v
          python3 -m unittest discover -s tests -p test_gitcode_api.py -v
          python3 -m unittest discover -s tests -p test_gitcode_stages.py -v
          python3 -m unittest discover -s tests -p test_workflow_baselines.py -v
          python3 -m unittest discover -s tests -p test_publish_gitcode_release.py -v
          python3 -m unittest discover -s tests -p test_pr_test_routing.py -v
      - name: Install pinned official China enterprise CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_dir="${RUNNER_TEMP}/trae-cn-bin"
          mkdir -p "$cli_dir"
          base=https://lf-cdn.trae.com.cn/obj/trae-com-cn/trae-cli/v2/releases/0.209.1
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 300 "$base/traex-linux-x86_64.gz" -o "$cli_dir/traex.gz"
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 180 "$base/traex-code-mode-host-linux-x86_64.gz" -o "$cli_dir/host.gz"
          echo "643cf93b876e89ea5c72c87d3448b26690c6b71e45b3a7756b914d2ca53c1405  $cli_dir/traex.gz" | sha256sum --check
          echo "493c137bf1ec909aa565e4e8e534d694edf3d9b388449019fbe7e3ab189d6765  $cli_dir/host.gz" | sha256sum --check
          gzip -dc "$cli_dir/traex.gz" > "$cli_dir/traex"
          gzip -dc "$cli_dir/host.gz" > "$cli_dir/traex-code-mode-host"
          chmod 755 "$cli_dir/traex" "$cli_dir/traex-code-mode-host"
          ln -s traex "$cli_dir/traecli"
          # Same delivery metadata as the official online ToB installer, with
          # updates disabled so the verified binary cannot change during the job.
          printf '%s\n' '{"channel":"public","release_channel":"stable","auto_update":false}' > "$cli_dir/trae-installation.json"
          "$cli_dir/traecli" --version
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y bubblewrap
          fi
          echo "$cli_dir" >> "$GITHUB_PATH"
      - name: Checkout Issue repository and prepare prompt
        uses: ./.github/actions/gitcode-issue
        with:
          operation: prepare
          token: ${{ secrets.GITCODE_TOKEN }}
          issue-url: ${{ inputs.issue_url || 'https://gitcode.com/cann/catlass/issues/739' }}
      - name: Analyze Issue and source
        id: trae
        uses: ./.github/actions/trae-cn
        with:
          trae-pat: ${{ secrets.TRAE_CN_PAT }}
          host: ${{ vars.TRAE_CN_HOST }}
          expected-version: 0.209.1
          model: DeepSeek-V4.1-Flash
          working-directory: _issue-source
          prompt-file: .trae-issue-context/prompt.md
          sandbox: read-only
          timeout-seconds: '900'
      - name: Publish and read back the short reply
        if: ${{ steps.trae.outputs.status == 'success' && (github.event_name == 'push' || inputs.publish) }}
        uses: ./.github/actions/gitcode-issue
        with:
          operation: publish
          token: ${{ secrets.GITCODE_TOKEN }}
          issue-url: ${{ inputs.issue_url || 'https://gitcode.com/cann/catlass/issues/739' }}
          response-file: ${{ steps.trae.outputs.response-file }}
          model: DeepSeek-V4.1-Flash
      - name: Save analysis and publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitcode-issue-reply-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _issue-result/
            ${{ steps.trae.outputs.result-directory }}
          retention-days: 7
