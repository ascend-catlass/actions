name: Publish GitCode Release bundle
description: Publish and verify a validated wheel bundle through the reusable GitCode Release stage
inputs:
  token:
    description: GitCode release token from an Actions secret
    required: true
  owner:
    description: GitCode repository owner
    default: cann
  repo:
    description: GitCode repository name
    default: catlass
  tag:
    description: Exact release tag
    required: true
  version:
    description: Exact package version
    required: true
  bundle:
    description: Validated release bundle directory
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITCODE_RELEASE_TOKEN: ${{ inputs.token }}
        RELEASE_OWNER: ${{ inputs.owner }}
        RELEASE_REPO: ${{ inputs.repo }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_BUNDLE: ${{ inputs.bundle }}
      run: |
        python3 "${GITHUB_ACTION_PATH}/../../../scripts/publish_gitcode_release.py" \
          --owner "$RELEASE_OWNER" --repo "$RELEASE_REPO" --tag "$RELEASE_TAG" \
          --version "$RELEASE_VERSION" --bundle "$RELEASE_BUNDLE"
