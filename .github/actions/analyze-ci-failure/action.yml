name: Analyze CI failure with TRAE CN
description: Read a GitHub run attempt and return a bounded DeepSeek diagnosis without publishing comments
inputs:
  github-token:
    description: GitHub token with Actions read permission for the caller repository
    required: true
  trae-pat:
    description: TRAE CN enterprise personal access token
    required: true
  run-id:
    description: GitHub workflow run to analyze in the caller repository
    required: true
  run-attempt:
    description: Attempt number to inspect
    default: '1'
  host:
    description: Optional TRAE CN enterprise API host
    default: ''
  model:
    description: TRAE CN model for the diagnosis and attribution
    default: DeepSeek-V4.1-Flash
outputs:
  analysis-file:
    description: UTF-8 Markdown diagnosis or unavailable-analysis note; caller decides how to publish it
    value: ${{ steps.workspace.outputs.directory }}/analysis.md
  status:
    description: analyzed or unavailable
    value: ${{ steps.render.outputs.status }}
runs:
  using: composite
  steps:
    - name: Create an isolated analysis workspace
      id: workspace
      shell: bash
      run: |
        directory=$(mktemp -d "${GITHUB_WORKSPACE}/ci-failure.XXXXXX")
        git -c core.hooksPath=/dev/null init --quiet "$directory"
        echo "directory=$directory" >> "$GITHUB_OUTPUT"
    - name: Download failed job logs with the official GitHub client
      id: logs
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ANALYSIS_DIRECTORY: ${{ steps.workspace.outputs.directory }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
      with:
        github-token: ${{ inputs.github-token }}
        retries: 2
        script: |
          const fs = require('node:fs');
          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
            ...context.repo, run_id: Number(process.env.RUN_ID),
            attempt_number: Number(process.env.RUN_ATTEMPT), per_page: 100
          });
          const evidence = [];
          for (const job of jobs.filter(job => job.conclusion === 'failure').slice(0, 4)) {
            const {data} = await github.rest.actions.downloadJobLogsForWorkflowRun({
              ...context.repo, job_id: job.id, request: {timeout: 60000}
            });
            evidence.push({job: job.name, steps: job.steps.filter(s => s.conclusion === 'failure').map(s => s.name),
              log: typeof data === 'string' ? data : Buffer.from(data).toString('utf8')});
          }
          if (!evidence.length) throw new Error('No failed jobs in this run attempt');
          fs.writeFileSync(`${process.env.ANALYSIS_DIRECTORY}/evidence.json`, JSON.stringify(evidence));
    - name: Prepare the bounded analysis prompt
      id: prompt
      if: ${{ steps.logs.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        ANALYSIS_DIRECTORY: ${{ steps.workspace.outputs.directory }}
      run: node "${GITHUB_ACTION_PATH}/comment.cjs" prepare
    - name: Install TRAE CN
      id: install
      if: ${{ steps.prompt.outcome == 'success' }}
      continue-on-error: true
      uses: ascend-catlass/actions/.github/actions/setup-trae-cn@main
    - name: Analyze logs with TRAE CN
      id: model
      if: ${{ steps.prompt.outcome == 'success' && steps.install.outcome == 'success' }}
      continue-on-error: true
      uses: ascend-catlass/actions/.github/actions/trae-cn@main
      with:
        trae-pat: ${{ inputs.trae-pat }}
        host: ${{ inputs.host }}
        expected-version: 0.209.1
        model: ${{ inputs.model }}
        working-directory: ${{ steps.workspace.outputs.directory }}
        prompt-file: prompt.md
        output-schema-file: schema.json
        sandbox: read-only
        timeout-seconds: '300'
    - name: Format the comment attachment
      id: render
      if: ${{ always() }}
      shell: bash
      env:
        ANALYSIS_DIRECTORY: ${{ steps.workspace.outputs.directory }}
        ANALYSIS_RESPONSE: ${{ steps.model.outputs.status == 'success' && steps.model.outputs.response-file || '' }}
        ANALYSIS_MODEL: ${{ inputs.model }}
      run: node "${GITHUB_ACTION_PATH}/comment.cjs" render
