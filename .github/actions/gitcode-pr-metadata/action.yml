name: Read GitCode PR metadata
description: Fetch and validate open pull request refs and head SHA through the shared API stage
inputs:
  token:
    description: GitCode token from an Actions secret
    required: true
  pr-number:
    description: Positive pull request number
    required: true
  repository:
    description: GitCode owner/repository
    default: cann/catlass
outputs:
  base_ref:
    description: Target branch
    value: ${{ steps.validate.outputs.base_ref }}
  head_ref:
    description: Source branch
    value: ${{ steps.validate.outputs.head_ref }}
  head_sha:
    description: Full source commit SHA
    value: ${{ steps.validate.outputs.head_sha }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_REPOSITORY: ${{ inputs.repository }}
      run: |
        [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'pr-number must be a positive integer' >&2; exit 1; }
        [[ "$PR_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || { echo 'invalid repository' >&2; exit 1; }
    - id: api
      uses: ascend-catlass/actions/.github/actions/gitcode-api@main
      with:
        token: ${{ inputs.token }}
        path: /repos/${{ inputs.repository }}/pulls/${{ inputs.pr-number }}
    - id: validate
      shell: bash
      env:
        RESPONSE_FILE: ${{ steps.api.outputs.response-file }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        state=$(jq -er '.state' "$RESPONSE_FILE")
        base_ref=$(jq -er '.base.ref // .target_branch' "$RESPONSE_FILE")
        head_ref=$(jq -er '.head.ref // .source_branch' "$RESPONSE_FILE")
        head_sha=$(jq -er '.head.sha' "$RESPONSE_FILE")
        [[ "$state" == open || "$state" == opened ]] || { echo "PR #$PR_NUMBER is not open" >&2; exit 1; }
        git check-ref-format --branch "$base_ref" >/dev/null
        git check-ref-format --branch "$head_ref" >/dev/null
        [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'GitCode returned an invalid head SHA' >&2; exit 1; }
        printf 'base_ref=%s\nhead_ref=%s\nhead_sha=%s\n' "$base_ref" "$head_ref" "$head_sha" >> "$GITHUB_OUTPUT"
