name: GitCode Issue context and reply
description: Prepare source and Issue context or publish and verify one owned model reply
inputs:
  operation:
    description: prepare or publish
    required: true
  token:
    description: GitCode token from an Actions secret
    required: true
  issue-url:
    description: GitCode Issue URL
    required: true
  worktree:
    description: Source checkout path; prepare clones here if absent
    default: _issue-source
  prompt-template:
    description: Trusted UTF-8 prompt template for prepare
    default: .github/prompts/gitcode-issue-reply.md
  result-directory:
    description: Directory for context metadata and publication evidence
    default: _issue-result
  response-file:
    description: Final model answer for publish
    default: ''
  model:
    description: Actual model name for the single final By line
    default: DeepSeek-V4.1-Flash
outputs:
  comment-url:
    description: Published comment URL
    value: ${{ steps.issue.outputs.comment-url }}
  result-directory:
    description: Context/publication evidence directory
    value: ${{ steps.issue.outputs.result-directory }}
runs:
  using: composite
  steps:
    - id: issue
      shell: bash
      env:
        GITCODE_TOKEN: ${{ inputs.token }}
        ISSUE_OPERATION: ${{ inputs.operation }}
        ISSUE_URL: ${{ inputs.issue-url }}
        ISSUE_WORKTREE: ${{ inputs.worktree }}
        ISSUE_TEMPLATE: ${{ inputs.prompt-template }}
        ISSUE_RESULT: ${{ inputs.result-directory }}
        ISSUE_RESPONSE: ${{ inputs.response-file }}
        ISSUE_MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        script="${GITHUB_ACTION_PATH}/../../../scripts/gitcode_issue_reply.py"
        case "$ISSUE_OPERATION" in
          prepare)
            if [[ ! -d "$ISSUE_WORKTREE" ]]; then
              source_url=$(PYTHONPATH="${GITHUB_ACTION_PATH}/../../.." python3 -c 'import os; from scripts.gitcode_issue_reply import parse_url; owner,repo,_=parse_url(os.environ["ISSUE_URL"]); print(f"https://gitcode.com/{owner}/{repo}.git")')
              git clone --depth 200 "$source_url" "$ISSUE_WORKTREE"
            fi
            python3 "$script" prepare --issue-url "$ISSUE_URL" --worktree "$ISSUE_WORKTREE" --template "$ISSUE_TEMPLATE" --output "$ISSUE_RESULT"
            ;;
          publish)
            python3 "$script" publish --issue-url "$ISSUE_URL" --output "$ISSUE_RESULT" --response "$ISSUE_RESPONSE" --model "$ISSUE_MODEL"
            ;;
          *) echo 'operation must be prepare or publish' >&2; exit 1 ;;
        esac
