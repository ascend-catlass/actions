name: Prepare CATLASS CI tests
description: Install repository requirements and select the NPU with the fewest processes
inputs:
  worktree:
    description: Source path in the test environment
    required: true
  container:
    description: Managed Docker container; empty for a container runner
    required: false
    default: ''
outputs:
  device-id:
    description: Selected runtime device index for DEVICE_ID
    value: ${{ steps.device.outputs.device-id }}
runs:
  using: composite
  steps:
    - name: Install root requirements.txt
      shell: bash
      env:
        RDV_WORKTREE: ${{ inputs.worktree }}
        RDV_CONTAINER: ${{ inputs.container }}
      run: |
        set -euo pipefail
        if [[ ! -f /.dockerenv && -n "${RDV_CONTAINER}" ]]; then
          docker exec --workdir "${RDV_WORKTREE}" "${RDV_CONTAINER}" \
            python3 -m pip install -r requirements.txt
        else
          cd "${RDV_WORKTREE}"
          python3 -m pip install -r requirements.txt
        fi
    - name: Select NPU with fewest processes
      id: device
      shell: bash
      env:
        RDV_CONTAINER: ${{ inputs.container }}
      run: |
        set -euo pipefail
        if [[ ! -f /.dockerenv && -n "${RDV_CONTAINER}" ]]; then
          device_id="$(docker exec -i "${RDV_CONTAINER}" python3 - < "${GITHUB_ACTION_PATH}/select-device.py")"
        else
          device_id="$(python3 "${GITHUB_ACTION_PATH}/select-device.py")"
        fi
        [[ "${device_id}" =~ ^[0-9]+$ ]]
        echo "device-id=${device_id}" >> "${GITHUB_OUTPUT}"
