name: Prepare CATLASS CI tests
description: Install filtered repository requirements, then select the NPU
inputs:
  worktree:
    description: Source path in the test environment
    required: true
  container:
    description: Managed Docker container; empty for a container runner
    required: false
    default: ''
outputs:
  device-id:
    description: NPU card ID selected by the upstream detect_npu.sh for DEVICE_ID
    value: ${{ steps.device.outputs.device-id }}
runs:
  using: composite
  steps:
    - name: Safely install repository Python requirements
      shell: bash
      env:
        RDV_WORKTREE: ${{ inputs.worktree }}
        RDV_CONTAINER: ${{ inputs.container }}
      run: |
        set -euo pipefail
        if [[ ! -f /.dockerenv && -n "${RDV_CONTAINER}" ]]; then
          docker exec -i "${RDV_CONTAINER}" bash -s -- "${RDV_WORKTREE}" <<'BASH'
          set -euo pipefail
          filtered=$(mktemp)
          trap 'rm -f -- "${filtered}"' EXIT
          awk 'tolower($0) !~ /^[[:space:]]*(torch([_-]npu)?|lit)([^[:alnum:]_-]|$)/' "$1/requirements.txt" > "${filtered}"
          python -m pip install -r "${filtered}"
        BASH
        else
          filtered=$(mktemp)
          trap 'rm -f -- "${filtered}"' EXIT
          awk 'tolower($0) !~ /^[[:space:]]*(torch([_-]npu)?|lit)([^[:alnum:]_-]|$)/' "${RDV_WORKTREE}/requirements.txt" > "${filtered}"
          python -m pip install -r "${filtered}"
        fi
    - name: Select NPU with fewest processes
      id: device
      shell: bash
      env:
        RDV_CONTAINER: ${{ inputs.container }}
      run: |
        set -euo pipefail
        if [[ ! -f /.dockerenv && -n "${RDV_CONTAINER}" ]]; then
          selection="$(docker exec -i "${RDV_CONTAINER}" bash -s -- --env < "${GITHUB_ACTION_PATH}/detect_npu.sh")"
        else
          selection="$(bash "${GITHUB_ACTION_PATH}/detect_npu.sh" --env)"
        fi
        if [[ ! "${selection}" =~ ^export[[:space:]]+NPU_SELECTED_DEVICE=([0-9]+)$ ]]; then
          echo "::error::Unexpected output from detect_npu.sh --env"
          exit 1
        fi
        device_id="${BASH_REMATCH[1]}"
        echo "Selected NPU: DEVICE_ID=${device_id}"
        echo "device-id=${device_id}" >> "${GITHUB_OUTPUT}"
