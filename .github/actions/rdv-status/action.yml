name: Update AtomGit RDV status
description: Maintain RDV labels and publish the final CI result on a AtomGit pull request

inputs:
  phase:
    description: Status transition to perform (start or finish)
    required: true
  pr-number:
    description: Pull request number in cann/catlass
    required: true
  token:
    description: AtomGit personal access token
    required: true
  result:
    description: Job result used by the finish phase
    required: false
  result-url:
    description: CI result URL published in the status comment
    required: true
  comment-id:
    description: Reserved input; current finish phase posts a new comment and does not use this ID
    required: false
  failure-analysis-file:
    description: Optional UTF-8 Markdown file appended only when finish result is failure (at most 8 KiB)
    default: ''

outputs:
  comment-id:
    description: AtomGit comment ID created by the start phase
    value: ${{ steps.status.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: Assemble the CATLASS RDV comment
      id: comment
      shell: bash
      env:
        RDV_PHASE: ${{ inputs.phase }}
        RDV_RESULT: ${{ inputs.result }}
        RDV_RESULT_URL: ${{ inputs.result-url }}
        RDV_FAILURE_ANALYSIS_FILE: ${{ inputs.failure-analysis-file }}
      run: bash "${GITHUB_ACTION_PATH}/rdv-status.sh"
    - name: Maintain the PR status through the public Action
      id: status
      uses: yuantao313/actions/atomgit-pr-status@fbfd9b229556d974d5aee35dafdf9dffe976facd
      with:
        token: ${{ inputs.token }}
        repository: cann/catlass
        pr-number: ${{ inputs.pr-number }}
        phase: ${{ inputs.phase }}
        result: ${{ inputs.result }}
        run-url: ${{ inputs.result-url }}
        body-file: ${{ steps.comment.outputs.body-file }}
        running-label: RDV-RUNNING
        success-label: RDV-SUCC
        failure-label: RDV-FAIL
