name: Remind a GitCode PR author after CI passes
description: Verify CATLASS PR state and CI label, then post a deduplicated review reminder
inputs:
  pr-number:
    description: Pull request number in cann/catlass
    required: true
  token:
    description: GitCode token with PR read and comment write permissions
    required: true
outputs:
  result:
    description: commented, already_reminded, pr_not_open or label_not_present
    value: ${{ steps.remind.outputs.result }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - id: remind
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        GITCODE_TOKEN: ${{ inputs.token }}
      run: python "${GITHUB_ACTION_PATH}/../../../scripts/gitcode_ci_passed.py"
