name: GitCode API
description: Shared authenticated GitCode v5 REST stage with file-based request and response
inputs:
  token:
    description: GitCode token from an Actions secret
    required: true
  method:
    description: GET, POST, PATCH, PUT or DELETE
    default: GET
  path:
    description: API path beginning with /, relative to the fixed GitCode v5 root
    required: true
  body-file:
    description: Optional JSON object file containing request fields, never credentials
    default: ''
  body-encoding:
    description: form or json
    default: form
outputs:
  response-file:
    description: UTF-8 JSON response file in RUNNER_TEMP
    value: ${{ steps.request.outputs.response-file }}
runs:
  using: composite
  steps:
    - id: request
      shell: bash
      env:
        GITCODE_TOKEN: ${{ inputs.token }}
        GITCODE_API_METHOD: ${{ inputs.method }}
        GITCODE_API_PATH: ${{ inputs.path }}
        GITCODE_API_BODY: ${{ inputs.body-file }}
        GITCODE_API_ENCODING: ${{ inputs.body-encoding }}
      run: python3 "${GITHUB_ACTION_PATH}/../../../scripts/gitcode_api.py"
