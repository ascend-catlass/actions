name: Prepare local AscendNPU-IR
description: Reuse or build an AscendNPU-IR tree in the worker-local archive

inputs:
  NPUIR_PIPELINE_POSTFIX:
    description: Archive suffix, normally an Asia/Shanghai date such as 20260909; empty means today
    required: false
    default: ""
  branch:
    description: AscendNPU-IR branch used when the archive is missing
    required: false
    default: feature/regbase
  ref:
    description: AscendNPU-IR commit used when the archive is missing
    required: false
    default: a07821269ede7a5e683ac02c8a2d291608083741
  use_mirror:
    description: Whether to use Huawei Cloud mirrors while building
    required: false
    default: "true"
  archive_root:
    description: Worker-local root containing completed AscendNPU-IR trees
    required: false
    default: /workspace/AscendNPU-IR-pipeline

outputs:
  path:
    description: Absolute path of the selected local AscendNPU-IR tree
    value: ${{ steps.resolve.outputs.path }}
  postfix:
    description: Resolved NPUIR_PIPELINE_POSTFIX
    value: ${{ steps.resolve.outputs.postfix }}
  source_sha:
    description: AscendNPU-IR source commit stored in the selected tree
    value: ${{ steps.result.outputs.source_sha }}
  cache_hit:
    description: Whether an existing completed tree was reused
    value: ${{ steps.inspect.outputs.cache_hit }}

runs:
  using: composite
  steps:
    - name: Resolve archive path
      id: resolve
      shell: bash
      env:
        POSTFIX_INPUT: ${{ inputs.NPUIR_PIPELINE_POSTFIX }}
        ARCHIVE_ROOT_INPUT: ${{ inputs.archive_root }}
      run: |
        set -euo pipefail

        postfix=${POSTFIX_INPUT}
        if [[ -z "${postfix}" ]]; then
          postfix=$(TZ=Asia/Shanghai date +%Y%m%d)
        fi
        if [[ ! "${postfix}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
          echo "::error::Invalid NPUIR_PIPELINE_POSTFIX: ${postfix}"
          exit 1
        fi

        archive_root=${ARCHIVE_ROOT_INPUT%/}
        archive_path="${archive_root}/${postfix}"
        work_path="${archive_root}/.building-${postfix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        container_name="npuir-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        echo "postfix=${postfix}" >> "${GITHUB_OUTPUT}"
        echo "path=${archive_path}" >> "${GITHUB_OUTPUT}"
        echo "work_path=${work_path}" >> "${GITHUB_OUTPUT}"
        echo "container_name=${container_name}" >> "${GITHUB_OUTPUT}"

    - name: Inspect local archive
      id: inspect
      shell: bash
      env:
        ARCHIVE_PATH: ${{ steps.resolve.outputs.path }}
        POSTFIX: ${{ steps.resolve.outputs.postfix }}
      run: |
        set -euo pipefail

        manifest="${ARCHIVE_PATH}/.npuir-pipeline"
        mlir_config="${ARCHIVE_PATH}/build/install/lib/cmake/mlir/MLIRConfig.cmake"

        if [[ ! -e "${ARCHIVE_PATH}" ]]; then
          echo "cache_hit=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [[ ! -f "${manifest}" || ! -f "${mlir_config}" ]]; then
          echo "::error::Incomplete NPUIR archive exists at ${ARCHIVE_PATH}; refusing to overwrite it"
          exit 1
        fi

        stored_postfix=$(sed -n 's/^NPUIR_PIPELINE_POSTFIX=//p' "${manifest}")
        source_sha=$(sed -n 's/^SOURCE_SHA=//p' "${manifest}")
        if [[ "${stored_postfix}" != "${POSTFIX}" || ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Invalid NPUIR archive manifest: ${manifest}"
          exit 1
        fi

        echo "cache_hit=true" >> "${GITHUB_OUTPUT}"
        echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
        echo "Reusing NPUIR ${POSTFIX} @ ${source_sha} from ${ARCHIVE_PATH}"

    - name: Check out AscendNPU-IR
      id: checkout
      if: ${{ steps.inspect.outputs.cache_hit != 'true' }}
      shell: bash
      env:
        NPUIR_BRANCH: ${{ inputs.branch }}
        NPUIR_REF: ${{ inputs.ref }}
        WORK_PATH: ${{ steps.resolve.outputs.work_path }}
      run: |
        set -euo pipefail

        if [[ -e "${WORK_PATH}" ]]; then
          echo "::error::Per-run NPUIR work directory already exists: ${WORK_PATH}"
          exit 1
        fi
        mkdir -p "${WORK_PATH%/*}"

        git clone --quiet --depth 1 --branch "${NPUIR_BRANCH}" \
          https://gitcode.com/Ascend/AscendNPU-IR.git "${WORK_PATH}"

        if git -C "${WORK_PATH}" rev-parse --verify --quiet "${NPUIR_REF}^{commit}" >/dev/null; then
          git -C "${WORK_PATH}" checkout --detach "${NPUIR_REF}"
        else
          git -C "${WORK_PATH}" fetch --quiet --depth 1 origin "${NPUIR_REF}"
          git -C "${WORK_PATH}" checkout --detach FETCH_HEAD
        fi
        git -C "${WORK_PATH}" submodule update --init --recursive --depth 1

        source_sha=$(git -C "${WORK_PATH}" rev-parse HEAD)
        echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
        echo "Building NPUIR ${NPUIR_BRANCH} @ ${source_sha}"

    - name: Patch LLVM headers
      if: ${{ steps.inspect.outputs.cache_hit != 'true' }}
      shell: bash
      env:
        WORK_PATH: ${{ steps.resolve.outputs.work_path }}
      run: |
        set -euo pipefail

        affine_header="${WORK_PATH}/third-party/llvm-project/mlir/include/mlir/Dialect/Affine/IR/ValueBoundsOpInterfaceImpl.h"
        interface_header="${WORK_PATH}/third-party/llvm-project/mlir/include/mlir/Interfaces/ValueBoundsOpInterface.h"

        grep -q '^#include <cstdint>$' "${affine_header}" || \
          sed -i 's|#include "mlir/Support/LLVM.h"|#include "mlir/Support/LLVM.h"\n#include <cstdint>|' "${affine_header}"
        grep -q '^#include <cstdint>$' "${interface_header}" || \
          sed -i 's|#include <queue>|#include <queue>\n#include <cstdint>|' "${interface_header}"

        grep -n '^#include <cstdint>$' "${affine_header}" "${interface_header}"

    - name: Create build container
      if: ${{ steps.inspect.outputs.cache_hit != 'true' }}
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.resolve.outputs.container_name }}
        WORK_PATH: ${{ steps.resolve.outputs.work_path }}
        NPUIR_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
      run: |
        set -euo pipefail

        docker run -d --name "${CONTAINER_NAME}" \
          -v "${WORK_PATH}:/workspace/AscendNPU-IR" \
          -w /workspace/AscendNPU-IR \
          "${NPUIR_IMAGE}" sleep infinity
        docker ps --filter "name=^/${CONTAINER_NAME}$" --format '{{.Names}} {{.Image}}'

    - name: Configure package mirrors
      if: ${{ steps.inspect.outputs.cache_hit != 'true' && inputs.use_mirror == 'true' }}
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.resolve.outputs.container_name }}
      run: |
        set -euo pipefail

        docker exec -u root "${CONTAINER_NAME}" bash -c '
          set -e
          printf "[global]\nindex-url = https://repo.huaweicloud.com/repository/pypi/simple\ntrusted-host = repo.huaweicloud.com\n" > /etc/pip.conf
          sed -i \
            -e "s|^mirrorlist=|#mirrorlist=|g" \
            -e "s|^# *baseurl=https://repo.almalinux.org/almalinux|baseurl=https://repo.huaweicloud.com/almalinux|g" \
            /etc/yum.repos.d/*.repo
          dnf clean all
        '

    - name: Install build dependencies
      if: ${{ steps.inspect.outputs.cache_hit != 'true' }}
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.resolve.outputs.container_name }}
      run: |
        set -euo pipefail

        docker exec -u root "${CONTAINER_NAME}" bash -c '
          set -e
          PYBIN=/opt/python/cp312-cp312/bin
          if [ ! -x "${PYBIN}/python" ]; then
            PYBIN=$(find /opt/python -maxdepth 1 -type d -name "cp3*" | sort -V | tail -1)/bin
          fi
          "${PYBIN}/python" -m pip install -U "cmake>=3.28" "ninja>=1.12"
          ln -sf "${PYBIN}/cmake" /usr/local/bin/cmake
          ln -sf "${PYBIN}/ninja" /usr/local/bin/ninja
          dnf install -y clang lld
          cmake --version | head -1
          ninja --version
          clang --version | head -1
          clang++ --version | head -1
        '

    - name: Build AscendNPU-IR
      if: ${{ steps.inspect.outputs.cache_hit != 'true' }}
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.resolve.outputs.container_name }}
      run: |
        set -euo pipefail

        docker exec -u "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          "${CONTAINER_NAME}" bash -c '
            set -e
            cd /workspace/AscendNPU-IR
            ./build-tools/build.sh \
              --c-compiler "$(command -v clang)" \
              --cxx-compiler "$(command -v clang++)" \
              "--add-cmake-options=-DCMAKE_SYSROOT=/" \
              "--add-cmake-options=-DLLVM_ENABLE_ZSTD=OFF" \
              "--add-cmake-options=-DLLVM_ENABLE_RTTI=ON" \
              --build-type Release \
              -j "$(nproc)" \
              --enable-assertion \
              --disable-werror \
              --disable-mlir-werror \
              --disable-bishengir-werror \
              --build-triton \
              --enable-lld \
              --build ./build \
              --apply-patches
          '

    - name: Validate and publish local archive
      id: publish
      if: ${{ steps.inspect.outputs.cache_hit != 'true' }}
      shell: bash
      env:
        ARCHIVE_PATH: ${{ steps.resolve.outputs.path }}
        POSTFIX: ${{ steps.resolve.outputs.postfix }}
        WORK_PATH: ${{ steps.resolve.outputs.work_path }}
        SOURCE_SHA: ${{ steps.checkout.outputs.source_sha }}
        NPUIR_BRANCH: ${{ inputs.branch }}
        NPUIR_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail

        mlir_config="${WORK_PATH}/build/install/lib/cmake/mlir/MLIRConfig.cmake"
        if [[ ! -f "${mlir_config}" ]]; then
          echo "::error::NPUIR build did not produce ${mlir_config}"
          exit 1
        fi
        if [[ -e "${ARCHIVE_PATH}" ]]; then
          echo "::error::Archive path appeared while building: ${ARCHIVE_PATH}"
          exit 1
        fi

        {
          echo "NPUIR_PIPELINE_POSTFIX=${POSTFIX}"
          echo "SOURCE_SHA=${SOURCE_SHA}"
          echo "SOURCE_BRANCH=${NPUIR_BRANCH}"
          echo "SOURCE_REF=${NPUIR_REF}"
          echo "BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        } > "${WORK_PATH}/.npuir-pipeline"

        mv "${WORK_PATH}" "${ARCHIVE_PATH}"
        echo "Published worker-local NPUIR archive: ${ARCHIVE_PATH}"

    - name: Resolve selected source commit
      id: result
      shell: bash
      env:
        CACHE_HIT: ${{ steps.inspect.outputs.cache_hit }}
        CACHED_SHA: ${{ steps.inspect.outputs.source_sha }}
        BUILT_SHA: ${{ steps.checkout.outputs.source_sha }}
      run: |
        set -euo pipefail

        if [[ "${CACHE_HIT}" == true ]]; then
          source_sha=${CACHED_SHA}
        else
          source_sha=${BUILT_SHA}
        fi
        if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Could not resolve selected NPUIR source commit"
          exit 1
        fi
        echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

    - name: Clean up transient NPUIR resources
      if: ${{ always() }}
      shell: bash
      env:
        ARCHIVE_ROOT: ${{ inputs.archive_root }}
        CONTAINER_NAME: ${{ steps.resolve.outputs.container_name }}
        WORK_PATH: ${{ steps.resolve.outputs.work_path }}
      run: |
        set -euo pipefail

        if [[ -n "${CONTAINER_NAME}" ]]; then
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
        fi

        archive_root=${ARCHIVE_ROOT%/}
        case "${WORK_PATH}" in
          "${archive_root}/.building-"*) rm -rf -- "${WORK_PATH}" ;;
          "") ;;
          *) echo "::error::Refusing to clean unexpected path: ${WORK_PATH}"; exit 1 ;;
        esac
