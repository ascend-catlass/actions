name: Manage local AscendNPU-IR archive
description: Validate and publish shared dated NPUIR trees, with a monotonic latest symlink
inputs:
  operation:
    description: Operation to perform (lookup or publish)
    required: true
  source_sha:
    description: Exact AscendNPU-IR source commit represented by the archive
    required: true
  target_arch:
    description: Target CPU architecture, such as x86_64 or aarch64
    required: true
  build_contract:
    description: Human-readable version of the build options and toolchain contract
    required: true
  baseline_date:
    description: Version date (YYYYMMDD), used for directory and latest ordering
    required: true
  archive_root:
    description: Shared archive root on this worker
    required: false
    default: /opt/AscendNPU-IR
  source_path:
    description: Completed per-run tree to publish; required for publish
    required: false
    default: ''
  source_branch:
    description: Source branch recorded in the archive manifest
    required: false
    default: ''
  source_ref:
    description: Requested source ref recorded in the archive manifest
    required: false
    default: ''
  build_fingerprint:
    description: Exact installed toolchain fingerprint to record or require
    required: false
    default: ''
  legacy_postfix:
    description: Old runner-local date suffix eligible for migration
    required: false
    default: ''
  legacy_build_fingerprint:
    description: Build fingerprint required when reusing the old date-based archive
    required: false
    default: ''
outputs:
  path:
    description: Absolute path of the selected dated AscendNPU-IR tree
    value: ${{ steps.archive.outputs.path }}
  work_path:
    description: Same-filesystem temporary path where the caller can build a missing archive
    value: ${{ steps.archive.outputs.work_path }}
  archive_key:
    description: Content-oriented archive key
    value: ${{ steps.archive.outputs.archive_key }}
  source_sha:
    description: AscendNPU-IR source commit stored in the selected archive
    value: ${{ steps.archive.outputs.source_sha }}
  target_arch:
    description: Target CPU architecture stored in the selected archive
    value: ${{ steps.archive.outputs.target_arch }}
  build_contract:
    description: Build contract stored in the selected archive
    value: ${{ steps.archive.outputs.build_contract }}
  baseline_date:
    description: Version date stored in the selected archive
    value: ${{ steps.archive.outputs.baseline_date }}
  build_fingerprint:
    description: Toolchain fingerprint stored in the selected archive
    value: ${{ steps.archive.outputs.build_fingerprint }}
  cache_hit:
    description: Whether lookup found an existing completed archive
    value: ${{ steps.archive.outputs.cache_hit }}
  legacy_cache_hit:
    description: Whether lookup migrated an old runner-local archive
    value: ${{ steps.archive.outputs.legacy_cache_hit }}
runs:
  using: composite
  steps:
  - name: Inspect or publish shared dated archive
    id: archive
    shell: bash
    env:
      OPERATION: ${{ inputs.operation }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET_ARCH: ${{ inputs.target_arch }}
      BUILD_CONTRACT: ${{ inputs.build_contract }}
      BASELINE_DATE: ${{ inputs.baseline_date }}
      ARCHIVE_ROOT_INPUT: ${{ inputs.archive_root }}
      SOURCE_PATH: ${{ inputs.source_path }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_REF: ${{ inputs.source_ref }}
      BUILD_FINGERPRINT: ${{ inputs.build_fingerprint }}
      LEGACY_POSTFIX: ${{ inputs.legacy_postfix }}
      LEGACY_BUILD_FINGERPRINT: ${{ inputs.legacy_build_fingerprint }}
    run: bash "${GITHUB_ACTION_PATH}/manage-archive.sh"
