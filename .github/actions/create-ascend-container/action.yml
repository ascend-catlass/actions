name: Create Ascend container
description: Create a disposable Ascend container, or reuse the current container environment

inputs:
  image-repository:
    description: Container image repository (CANN_REPO)
    required: false
    default: catlass-dsl-lab
  image-tag:
    description: Container image tag (CANN_TAG)
    required: false
    default: ubuntu24-py312-rdv-v2
  base-image:
    description: Ubuntu 24.04 base image used only when building a missing image
    default: ubuntu:24.04
  cann-root:
    description: Host weekly CANN toolkit directory (resolved before mounting read-only)
    default: /opt/cann_weekly/latest/ascend-toolkit
  npuir-root:
    description: Host prepared NPUIR source and install tree (mounted read-only)
    default: /opt/AscendNPU-IR/latest/AscendNPU-IR
  name:
    description: Unique container name (NAME)
    required: true
  worktree:
    description: Existing host source directory to mount
    required: true
  container-worktree:
    description: Source directory inside the new container
    required: false
    default: /workspace/catlass
  cpus:
    description: CPU limit in cores for the managed container (empty disables the limit)
    required: false
    default: '16'
  memory:
    description: Memory limit for the managed container, for example 128g (empty disables the limit)
    required: false
    default: 128g
  memory-swap:
    description: Swap limit; equal to memory disables swapping inside the container
    required: false
    default: 128g

outputs:
  container-name:
    description: Name of the managed container; empty when already inside a container
    value: ${{ steps.create.outputs.container-name }}
  worktree:
    description: Source path to use for tests in the selected environment
    value: ${{ steps.create.outputs.worktree }}

runs:
  using: composite
  steps:
    - name: Detect environment and create container
      id: create
      shell: bash
      env:
        CANN_REPO: ${{ inputs.image-repository }}
        CANN_TAG: ${{ inputs.image-tag }}
        BASE_IMAGE: ${{ inputs.base-image }}
        NAME: ${{ inputs.name }}
        HOST_WORKTREE: ${{ inputs.worktree }}
        CONTAINER_WORKTREE: ${{ inputs.container-worktree }}
        CANN_ROOT: ${{ inputs.cann-root }}
        NPUIR_ROOT: ${{ inputs.npuir-root }}
        CONTAINER_CPUS: ${{ inputs.cpus }}
        CONTAINER_MEMORY: ${{ inputs.memory }}
        CONTAINER_MEMORY_SWAP: ${{ inputs.memory-swap }}
      run: bash "${GITHUB_ACTION_PATH}/create-ascend-container.sh"
