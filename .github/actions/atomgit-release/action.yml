name: Publish AtomGit Release bundle
description: Publish and verify a validated wheel bundle through the reusable AtomGit Release stage
inputs:
  token:
    description: AtomGit release token from an Actions secret
    required: true
  owner:
    description: AtomGit repository owner
    default: cann
  repo:
    description: AtomGit repository name
    default: catlass
  tag:
    description: Exact release tag
    required: true
  version:
    description: Exact package version
    required: true
  bundle:
    description: Validated release bundle directory
    required: true
runs:
  using: composite
  steps:
    - name: Validate CATLASS assets and reuse matching uploads
      shell: bash
      env:
        ATOMGIT_TOKEN: ${{ inputs.token }}
        RELEASE_REPOSITORY: ${{ inputs.owner }}/${{ inputs.repo }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_BUNDLE: ${{ inputs.bundle }}
      run: |
        python3 -m scripts.prepare_atomgit_assets --repository "$RELEASE_REPOSITORY" \
          --tag "$RELEASE_TAG" --bundle "$RELEASE_BUNDLE" --output "$RELEASE_BUNDLE/assets.json"
    - name: Publish validated assets through the public AtomGit Action
      uses: yuantao313/actions/atomgit-release@02defff4ec04b38b33adfaec06bcb1406f5a2150
      with:
        token: ${{ inputs.token }}
        repository: ${{ inputs.owner }}/${{ inputs.repo }}
        tag: ${{ inputs.tag }}
        name: ascend-catlass-dsl ${{ inputs.version }}
        body-file: ${{ inputs.bundle }}/release-notes.md
        assets-file: ${{ inputs.bundle }}/assets.json
