site_name: CATLASS Automation · 自动化手册
site_description: Practical Chinese and English guides to CATLASS reusable GitHub
  Actions
repo_url: https://github.com/ascend-catlass/actions
repo_name: ascend-catlass/actions
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: '/plans/

  '
theme:
  name: mkdocs
  locale: zh_CN
  navigation_depth: 3
plugins:
- search:
    lang:
    - en
markdown_extensions:
- tables
- admonition
- toc:
    permalink: true
extra_css:
- assets/docs.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
- Start / 入口: index.md
- 中文:
  - 概览: zh/index.md
  - 工作流: zh/workflows.md
  - DSL 轻量环境实验: zh/dsl-environment.md
  - 术语: zh/glossary.md
  - Actions:
    - catlass-ai · 统一 AI 执行策略: zh/actions/catlass-ai.md
    - analyze-ci-failure · 分析 CI 失败原因: zh/actions/analyze-ci-failure.md
    - community-repo-roles · 查询社区维护者与 Committer: zh/actions/community-repo-roles.md
    - create-ascend-container · 创建昇腾测试容器: zh/actions/create-ascend-container.md
    - atomgit-ci-passed · CI 通过后提醒代码检视: zh/actions/atomgit-ci-passed.md
    - atomgit-issue · 准备、回复或分配 AtomGit Issue: zh/actions/atomgit-issue.md
    - atomgit-issue-label · 为新建 Issue 选择类型标签: zh/actions/atomgit-issue-label.md
    - atomgit-release · 发布 AtomGit Release 安装包: zh/actions/atomgit-release.md
    - npuir-local-archive · 复用本机 AscendNPU-IR 构建归档: zh/actions/npuir-local-archive.md
    - prepare-ci-tests · 准备测试依赖并选择 NPU: zh/actions/prepare-ci-tests.md
    - rdv-status · 把 RDV 测试状态写回 PR: zh/actions/rdv-status.md
    - run-ci-tests · 运行 CATLASS 测试阶段: zh/actions/run-ci-tests.md
    - install-cann-release · 安装正式发布 CANN: zh/actions/install-cann-release.md
  - 文档维护: zh/maintaining.md
- English:
  - Overview: en/index.md
  - Workflows: en/workflows.md
  - DSL environment experiment: en/dsl-environment.md
  - Build and runner operations: en/operations.md
  - Glossary: en/glossary.md
  - Actions:
    - catlass-ai · Shared AI execution policy: en/actions/catlass-ai.md
    - analyze-ci-failure · Analyze CI failure: en/actions/analyze-ci-failure.md
    - community-repo-roles · Look up community maintainers and committers: en/actions/community-repo-roles.md
    - create-ascend-container · Create an Ascend test container: en/actions/create-ascend-container.md
    - atomgit-ci-passed · Send a review reminder after CI passes: en/actions/atomgit-ci-passed.md
    - atomgit-issue · Prepare, reply to or assign a AtomGit Issue: en/actions/atomgit-issue.md
    - atomgit-issue-label · Classify new Issues: en/actions/atomgit-issue-label.md
    - atomgit-release · Publish a AtomGit release bundle: en/actions/atomgit-release.md
    - npuir-local-archive · Reuse local AscendNPU-IR build archives: en/actions/npuir-local-archive.md
    - prepare-ci-tests · Prepare test dependencies and select an NPU: en/actions/prepare-ci-tests.md
    - rdv-status · Report RDV test status on a PR: en/actions/rdv-status.md
    - run-ci-tests · Run a CATLASS test stage: en/actions/run-ci-tests.md
    - install-cann-release · Install a CANN release: en/actions/install-cann-release.md
  - Maintain the docs: en/maintaining.md
